name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The v0.1.0 source is copied from the committed Nakamoto Institute
      # archive and verified against src/source-manifest.json (no network)
      - name: Fetch Bitcoin v0.01 source
        run: npm run fetch

      # Schema, citation keys, line anchors — fails on silent content loss
      - name: Validate annotations
        run: npm run validate

      - name: Build book HTML
        run: npm run build

      # Reads the built HTML, so it must run after the build
      - name: Index tests
        run: npm test

      - name: Upload built book
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-alpha-book-html
          path: output/bitcoin-alpha-book.html
          retention-days: 14
