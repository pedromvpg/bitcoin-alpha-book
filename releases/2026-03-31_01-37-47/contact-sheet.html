<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Alpha Book — Contact sheet (print overview)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #3a3a3a;
      color: #ccc;
      font-family: 'Basis Grotesque Mono Pro', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }
    header { text-align: center; }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #eee;
    }
    header p {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }
    .sheet {
      border: 1px solid #555;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .sheet img { display: block; max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Bitcoin Alpha Book — Contact sheet (print overview)</h1>
    <p>566 pages &nbsp;·&nbsp; 283 spreads &nbsp;·&nbsp; 8 spreads/row &nbsp;·&nbsp; ~36 spread rows &nbsp;·&nbsp; scale 0.18 &nbsp;·&nbsp; full cover spread &nbsp;·&nbsp; generated 2026-03-30</p>
  </header>
  <div class="sheet">
    <img src="contact-sheet.png" alt="Book pages grouped in print spreads with cover spread for validation">
  </div>
</body>
</html>
