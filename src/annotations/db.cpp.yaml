# Annotation for db.cpp - Database Implementation
file: "db.cpp"

title: "Memory That Survives"

introduction: |
  <p>
    Bitcoin needs persistent storage that survives restarts: your wallet (private
    keys and transaction history), the blockchain index (where each block lives on
    disk), and peer addresses (nodes to reconnect to after shutdown). Satoshi chose
    <strong>Berkeley DB</strong> (BDB), a mature embedded key-value database from
    Sleepycat Software—battle-tested since 1991 and used by OpenLDAP, MySQL, and
    Subversion.{{cite:bdb-license}} It required no separate server process, supported ACID transactions,
    and shipped with solid C++ bindings.
  </p>
  <p>
    Everything in Bitcoin is ultimately stored as a key-value pair. Transactions are
    keyed by their 256-bit hash. Blocks are indexed by their hash. Addresses live under
    a 160-bit key. Even user settings ("fGenerateBitcoins", "nTransactionFee") are
    persisted as string-keyed values. <code>db.cpp</code> is the single file that
    bridges Bitcoin's in-memory C++ objects and their durable on-disk representations.
  </p>
  <p>
    The file defines five databases: <code>CTxDB</code> (blockchain index and
    transaction positions), <code>CAddrDB</code> (peer network addresses),
    <code>CReviewDB</code> (an unused peer-rating system Satoshi never launched),
    and <code>CWalletDB</code> (your private keys, transactions, and address book).
    All five inherit from the base <code>CDB</code> class, which handles the BDB
    environment lifecycle.
  </p>
  <p>
    BDB served Bitcoin well until v0.8 (February 2013), when an obscure configuration
    limit became a consensus bug. BDB imposes a ceiling on concurrent "database locks."
    Block 225,430—a large but perfectly valid block—exceeded that ceiling on BDB-backed
    nodes but not on the new LevelDB-backed ones, causing an unintentional chain split
    documented as <strong>BIP 50</strong>.{{cite:bip-50}} Resolution required miners to deliberately
    orphan the longer (LevelDB) chain and revert to the shorter (BDB-compatible) one—
    a coordinated rollback that cost one pool operator over 24 BTC in reversed coinbases.
    The incident proved that consensus rules extend beyond Bitcoin's source code to
    encompass the database engine, its configuration, and even the operating system.
    After BIP 50, the blockchain index migrated to LevelDB; the wallet retains BDB
    to this day for backward compatibility with existing <code>wallet.dat</code> files.{{cite:bip-50}}{{cite:bitcoin-core-history}}
  </p>

annotations:
  # ── Global state ────────────────────────────────────────────────────────────
  - line: 16
    type: margin
    text: "<code class=\"keyword\">cs_db</code> — the database mutex. All BDB environment operations acquire this lock first, preventing concurrent initialisation or shutdown from two threads."

  - line: 17
    type: margin
    text: "<code class=\"variable\">fDbEnvInit</code> — lazy-init flag. The BDB environment is expensive to open; it is created only on the first <code class=\"type\">CDB</code> constructor call and shared by every database file thereafter."

  - line: 19
    type: margin
    text: "<code class=\"variable\">mapFileUseCount</code> — reference-counts open database handles by filename. <code class=\"function\">DBFlush</code> uses this to know which files can be safely flushed: a file with a non-zero count still has live cursors or transactions."

  # ── CDBInit ──────────────────────────────────────────────────────────────────
  - line: 21
    type: margin
    text: "<code class=\"type\">CDBInit</code> — RAII guard for the BDB environment. Its destructor calls <code class=\"function\">dbenv.close()</code> when the program exits, ensuring the write-ahead log is flushed and no database is left in an inconsistent state. The single global instance <code class=\"variable\">instance_of_cdbinit</code> at line 36 makes this automatic."

  # ── CDB constructor ──────────────────────────────────────────────────────────
  - line: 39
    type: margin
    text: "<code class=\"type\">CDB</code> constructor — opens (or creates) a named database file. <code class=\"variable\">pszMode</code> mirrors <code class=\"function\">fopen</code> semantics: <code>\"r\"</code> = read-only, <code>\"r+\"</code> = read-write, <code>\"cr+\"</code> = create if absent then read-write. Every specialised database class passes a specific mode."

  - line: 45
    type: margin
    text: "Mode string parsing. <code class=\"function\">strchr</code> tests for individual characters: <code>'c'</code> means create if absent, absence of <code>'+'</code> and <code>'w'</code> means read-only. These flags are translated into BDB's <code class=\"variable\">nFlags</code> bitmask below."

  - line: 52
    type: margin
    text: "<code class=\"variable\">DB_AUTO_COMMIT</code> — wraps every individual read or write in an implicit transaction when no explicit transaction is open. This gives single-operation atomicity for free: a write either commits fully or does nothing."

  - line: 55
    type: margin
    text: "First <code class=\"type\">CDB</code> construction triggers one-time environment setup, guarded by <code class=\"keyword\">cs_db</code>. Subsequent opens skip straight to line 85. The environment is shared process-wide: all five database files use the same log directory, lock manager, and memory pool."

  - line: 60
    type: margin
    text: "Transaction log directory (<code>\\database</code> subdirectory). BDB's write-ahead log records every mutation here before applying it to the data file. On crash, BDB replays the log on <code class=\"variable\">DB_RECOVER</code> to restore consistency—Bitcoin gets crash safety for free."

  - line: 64
    type: margin
    text: "<code class=\"function\">set_lk_max_locks(10000)</code> — the configuration that became BIP 50.{{cite:bip-50}} BDB counts every row-level lock a transaction holds simultaneously. Large blocks with thousands of inputs can exceed this limit on old BDB builds. Nodes that hit the limit refused to validate the block; nodes with newer BDB accepted it — splitting the chain."

  - line: 70
    type: margin
    text: "BDB environment flags. <code class=\"variable\">DB_INIT_LOCK</code> enables the lock subsystem (for concurrent access). <code class=\"variable\">DB_INIT_LOG</code> enables the write-ahead log (crash recovery). <code class=\"variable\">DB_INIT_MPOOL</code> enables the shared buffer pool (read cache). <code class=\"variable\">DB_INIT_TXN</code> enables transactions. <code class=\"variable\">DB_PRIVATE</code> means no other process may share this environment."

  - line: 78
    type: margin
    text: "<code class=\"variable\">DB_RECOVER</code> — on open, replay the write-ahead log and roll back any uncommitted transactions from a previous crash. Bitcoin inherits full ACID durability from BDB without writing any recovery code itself."

  - line: 89
    type: margin
    text: "Open a <code class=\"variable\">DB_BTREE</code> (B-tree) database. BDB supports hash tables and queues too, but B-tree gives efficient range scans — essential for <code class=\"function\">LoadBlockIndex</code>, which iterates every block record in key order. The logical name <code>\"main\"</code> allows multiple B-trees to share one physical file."

  - line: 108
    type: margin
    text: "On first creation, write the software version. Later code reads this to detect wallet files created by older Bitcoin versions and perform any necessary migration."

  # ── CDB::Close ───────────────────────────────────────────────────────────────
  - line: 114
    type: margin
    text: "<code class=\"function\">CDB::Close</code> — safe shutdown sequence. Aborts any open transaction (<code class=\"variable\">vTxn.front()->abort()</code>), closes the <code class=\"type\">Db</code> handle, checkpoints the log, then decrements the file's use-count. Leaving this sequence incomplete — for example, by crashing — is safe because <code class=\"variable\">DB_RECOVER</code> handles it on restart."

  - line: 124
    type: margin
    text: "<code class=\"function\">txn_checkpoint(0, 0, 0)</code> — flushes the in-memory log buffer to the data file immediately. Without this, committed writes sit in the log until BDB decides to checkpoint. Called here and in <code class=\"function\">DBFlush</code> to guarantee that closed files are fully durable on disk."

  # ── DBFlush ───────────────────────────────────────────────────────────────────
  - line: 132
    type: margin
    text: "<code class=\"function\">DBFlush</code> — called periodically and on shutdown. Checkpoints the environment, then iterates <code class=\"variable\">mapFileUseCount</code>: any file with zero open handles gets its log sequence numbers reset (<code class=\"function\">lsn_reset</code>), freeing log space. On shutdown, archives and removes stale log files, then closes the environment."

  - line: 147
    type: margin
    text: "<code class=\"function\">lsn_reset</code> — resets log sequence numbers for a closed database file. Required before the file can be moved or copied safely (e.g., when a user backs up <code>wallet.dat</code> while Bitcoin is running). Without this reset, the file's LSN would be out of sync with the environment's log."

  # ── CTxDB ─────────────────────────────────────────────────────────────────────
  - line: 173
    type: margin
    text: "<code class=\"function\">ReadTxIndex</code> — given a transaction hash, returns a <code class=\"type\">CTxIndex</code> containing the on-disk position (<code class=\"type\">CDiskTxPos</code>) and the number of outputs. This is the lookup that lets Bitcoin validate new transactions: before accepting a spend, the node checks here that the referenced output actually exists."

  - line: 180
    type: margin
    text: "<code class=\"function\">UpdateTxIndex</code> — persists spent-output state. Connecting an input writes the spender's disk position into <code class=\"variable\">vSpent</code>; disconnecting a block clears it. v0.01 does not delete a tx when one output is spent — it updates per-output markers."

  - line: 186
    type: margin
    text: "<code class=\"function\">AddTxIndex</code> — records where a newly-confirmed transaction lives on disk. The key is the transaction hash; the value is the file number, byte offset, and output count. This index is what makes it possible to locate any transaction in O(log n) time without scanning the entire blockchain."

  - line: 210
    type: margin
    text: "<code class=\"function\">ReadOwnerTxes</code> — scans for all transactions sent to an address. Uses a BDB cursor with <code class=\"variable\">DB_SET_RANGE</code> to seek to the first <code>\"owner\"</code> record matching the 160-bit hash, then iterates with <code class=\"variable\">DB_NEXT</code>. This is a range scan — the B-tree ordering makes it efficient."

  - line: 220
    type: margin
    text: "<code class=\"variable\">DB_SET_RANGE</code> positions the cursor at the first key ≥ the supplied key. On subsequent iterations <code class=\"variable\">DB_NEXT</code> advances one record at a time. This cursor pattern appears in <code class=\"function\">LoadBlockIndex</code> and <code class=\"function\">LoadAddresses</code> as well — it is the idiomatic BDB way to iterate a subset of records."

  - line: 256
    type: margin
    text: "<code class=\"function\">ReadDiskTx</code> — two-step transaction retrieval: first fetch the <code class=\"type\">CTxIndex</code> (containing the disk position), then read the full serialised <code class=\"type\">CTransaction</code> from that position in <code>blk0001.dat</code>. The four overloads accept either a hash or an <code class=\"type\">COutPoint</code> (txid + output index), with and without returning the index."

  # ── WriteBlockIndex / InsertBlockIndex ───────────────────────────────────────
  - line: 282
    type: margin
    text: "<code class=\"function\">WriteBlockIndex</code> — persists one block's metadata to BDB. The key is the block hash; the value is a <code class=\"type\">CDiskBlockIndex</code> containing the previous hash, merkle root, timestamp, difficulty bits, nonce, and on-disk position. Everything needed to reconstruct the chain — without reading the raw block data."

  - line: 302
    type: margin
    text: "<code class=\"function\">InsertBlockIndex</code> — interns a block hash into the global <code class=\"variable\">mapBlockIndex</code>. Returns the existing pointer if the hash is already known, or allocates a new <code class=\"type\">CBlockIndex</code>. Because the pointer is stored back into the map's own key, <code class=\"variable\">pindexNew->phashBlock</code> is stable for the lifetime of the map — a clean self-referential trick."

  # ── LoadBlockIndex ────────────────────────────────────────────────────────────
  - line: 322
    type: margin
    text: "<code class=\"function\">LoadBlockIndex</code> — reconstructs the entire in-memory blockchain index from BDB on startup. Iterates every <code>\"blockindex\"</code> record, deserialises each <code class=\"type\">CDiskBlockIndex</code>, and re-links the <code class=\"type\">CBlockIndex</code> doubly-linked list (<code class=\"variable\">pprev</code>, <code class=\"variable\">pnext</code>). Without this, Bitcoin would need to re-scan every block file on each launch."

  - line: 354
    type: margin
    text: "Re-linking the chain. Each <code class=\"type\">CDiskBlockIndex</code> stores <code class=\"variable\">hashPrev</code> and <code class=\"variable\">hashNext</code>. <code class=\"function\">InsertBlockIndex</code> converts those hashes back to pointers, rebuilding the doubly-linked list that lets the node walk the chain in either direction in O(1) per step."

  - line: 366
    type: margin
    text: "Genesis block detection. On first run, no genesis block exists yet; it will be added later. On subsequent starts, this line finds the genesis <code class=\"type\">CBlockIndex</code> and sets the global <code class=\"variable\">pindexGenesisBlock</code> pointer — the anchor of the entire chain."

  - line: 375
    type: margin
    text: "<code class=\"function\">ReadHashBestChain</code> — restores the chain tip. After iterating all block records, this line fetches the hash of the best (longest) chain as of last shutdown. Bitcoin then sets <code class=\"variable\">pindexBest</code> and <code class=\"variable\">nBestHeight</code>, giving the node an immediate starting point to request new blocks from peers."

  # ── CAddrDB ───────────────────────────────────────────────────────────────────
  - line: 399
    type: margin
    text: "<code class=\"function\">CAddrDB::WriteAddress</code> — persists a peer's IP, port, and service flags. The key is derived from the address itself (<code class=\"function\">addr.GetKey()</code>), so writing the same address twice is idempotent — it just updates the record."

  - line: 404
    type: margin
    text: "<code class=\"function\">LoadAddresses</code> — peer discovery on startup. First reads <code>addr.txt</code> if it exists (user-supplied seed nodes), then iterates BDB for every previously-discovered peer. On a fresh install with no BDB records, the node falls back to the hardcoded IRC bootstrap in <code>net.cpp</code>."

  - line: 409
    type: margin
    text: "<code>addr.txt</code> — a plain-text bootstrap file. One IP address per line. Satoshi included this escape hatch for users behind firewalls or on networks where IRC was blocked. It predates the <code>-connect</code> and <code>-addnode</code> command-line options added in later versions."

  # ── CReviewDB ─────────────────────────────────────────────────────────────────
  - line: 474
    type: margin
    text: "<code class=\"type\">CReviewDB</code> — a peer-rating database Satoshi designed but never activated. The idea: nodes could submit signed reviews of other nodes' reliability or honesty, stored and propagated like transactions. The infrastructure exists but no code ever calls <code class=\"function\">WriteReviews</code> in v0.01. It was quietly removed in later versions."

  # ── CWalletDB ─────────────────────────────────────────────────────────────────
  - line: 495
    type: margin
    text: "<code class=\"function\">CWalletDB::LoadWallet</code> — deserialises the entire wallet from <code>wallet.dat</code> at startup. Uses a BDB cursor to iterate every record, switching on the string type tag stored at the front of each key. The wallet schema — name, tx, key, defaultkey, setting — is a simple tagged union encoded in BDB."

  - line: 500
    type: margin
    text: "Double lock: <code class=\"keyword\">cs_mapKeys</code> then <code class=\"keyword\">cs_mapWallet</code>. Both must be held simultaneously while populating the in-memory maps. Consistent lock ordering (always keys before wallet) prevents deadlock with any other thread that needs both locks."

  - line: 524
    type: margin
    text: "<code>\"name\"</code> record — address book entry. Maps a Bitcoin address string to a human-readable label (e.g., <code>\"Alice\"</code>). These are the labels shown in the GUI's Sending Addresses and Receiving Addresses tabs. Purely local — never broadcast to the network."

  - line: 530
    type: margin
    text: "<code>\"tx\"</code> record — a wallet transaction. Stores the full <code class=\"type\">CWalletTx</code>, which wraps a <code class=\"type\">CTransaction</code> with extra metadata: the block it confirmed in, the time it was received, and whether it's marked as spent. The hash mismatch check at line 537 detects a corrupted wallet."

  - line: 548
    type: margin
    text: "<code>\"key\"</code> record — a keypair. The BDB key holds the 65-byte uncompressed public key; the value holds the private key. Both are loaded into <code class=\"variable\">mapKeys</code> (pubkey → privkey) and <code class=\"variable\">mapPubKeys</code> (hash160 → pubkey). Losing this record means losing the ability to spend any coins sent to that address."

  - line: 558
    type: margin
    text: "<code>\"defaultkey\"</code> — your primary receiving address. This is the key shown in the GUI's <em>Your Bitcoin Address</em> field. On first run, no default key exists and a fresh one is generated (see <code class=\"function\">LoadWallet</code> at line 580). On subsequent runs, this record restores continuity — you get the same address."

  - line: 562
    type: margin
    text: "<code>\"setting\"</code> records — persisted preferences. Three are saved here: <code class=\"variable\">fGenerateBitcoins</code> (mining on/off), <code class=\"variable\">nTransactionFee</code> (fee per transaction in satoshis), and <code class=\"variable\">addrIncoming</code> (the listening address for incoming connections). Settings survive restarts without any configuration file."

  - line: 580
    type: margin
    text: "<code class=\"function\">LoadWallet</code> wrapper — handles the first-run case. If the wallet loaded no default key (fresh install), it generates a new keypair, adds it to the wallet database, labels it <code>\"Your Address\"</code>, and writes it as the default. From this point on, the node has a Bitcoin identity: a private key that controls an address."

conclusion: |
  <p>
    <code>db.cpp</code> is Bitcoin's durability layer — the bridge between volatile
    in-memory state and a restart-safe disk representation. Every block validated,
    every transaction received, every key generated is ultimately written here.
    Satoshi's choice of Berkeley DB was pragmatic: a proven embedded database with
    ACID guarantees, requiring no infrastructure beyond the files in the application
    directory.
  </p>
  <p>
    The BIP 50 incident is a reminder that consensus is deeper than code.{{cite:bip-50}} BDB's
    lock limit — a tunable constant set to 10,000 at line 66 — became an invisible
    consensus rule. Any node configured differently would diverge on the same block.
    Bitcoin's migration to LevelDB for the chain index, while retaining BDB for
    wallet files, reflects the cost of that lesson: backward compatibility with
    <code>wallet.dat</code> files means BDB cannot be removed without breaking
    every existing wallet.{{cite:bitcoin-core-history}}
  </p>
