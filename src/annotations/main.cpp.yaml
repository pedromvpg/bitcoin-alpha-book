conclusion: |
  <p>
    This file embodies Satoshi's central insight: proof-of-work is not merely a
    rate-limiter (as in Adam Back's Hashcash){{cite:back-hashcash}} but the foundation of distributed
    consensus itself. Every predecessor—DigiCash,{{cite:chaum-digicash}} b-money,{{cite:dai-bmoney}} Bit Gold,{{cite:szabo-bit-gold}} RPOW{{cite:finney-rpow}}—stumbled
    on the same problem: how to prevent double-spending without a trusted third party.
    Satoshi solved it by making dishonesty more expensive than honesty.
  </p>
  <p>
    The elegance is in the alignment of incentives. Miners profit by following the
    rules and extending the longest chain. Rewriting history requires outspending
    all honest miners combined—an attack that becomes exponentially harder with each
    confirmation. Satoshi calculated in the whitepaper that an attacker controlling
    10% of network hashrate has only a 0.0006% chance of catching up after six blocks.{{cite:nakamoto-whitepaper}}
    This is why "six confirmations" became the industry standard for settlement finality.
  </p>
  <p>
    This code has been stress-tested under the most adversarial conditions imaginable:
    nation-state pressure, hundreds of billions of dollars at stake, and relentless
    scrutiny from security researchers worldwide. Continuity was not automatic at birth:
    forensic work on early block times and ExtraNonce sequences shows the chain halted
    for many hours in the first ~170 blocks when nobody was mining—then recovered as
    Hal Finney, Dustin Trammell, and others joined.{{cite:waltz-1stbitcoinminer}}{{cite:waltz-1stbitcoinminer-transcriptions}}
    That it still produces a block approximately every ten minutes is a testament to
    Satoshi's engineering—and to those first operators who kept the experiment alive.{{cite:genesis-block}}
  </p>
  <p>
    Satoshi's final public message before vanishing (April 2011): "I've moved on to
    other things. It's in good hands with Gavin and everyone."{{cite:nakamoto-farewell-2011}} These 2,300 lines of
    C++ launched a monetary system that has operated continuously for over seventeen
    years, securing over a trillion dollars in value, without a CEO, a board of
    directors, or a single hour of planned downtime.
  </p>
