# Annotation for main.cpp - The Heart of Bitcoin
file: "main.cpp"

title: "Where Consensus Lives"

introduction: |
  <p>
    This is the central nervous system of Bitcoin—2,300 lines of C++ that would
    eventually secure trillions of dollars. The <code>main.cpp</code> file contains
    the core logic that makes Bitcoin work: block creation, transaction processing,
    the proof-of-work consensus algorithm, and the rules that every node must follow.
  </p>
  <p>
    Satoshi Nakamoto spent roughly two years developing this code in secrecy before
    the January 2009 release. In an email to Hal Finney, he explained: "I had to write
    all the code before I could convince myself that I could solve every problem, then
    I wrote the paper."{{cite:nakamoto-finney-email}} Every design choice in this file
    reflects sustained thinking about game theory, cryptography, and distributed
    systems—the work of someone who understood that a single flaw would be fatal.
  </p>
  <p>
    The file solves what cryptographers called the "Byzantine Generals Problem"—how
    can distributed nodes agree on truth without trusting each other?{{cite:lamport-byzantine}}
    Satoshi's insight was to make lying expensive: proof-of-work forces nodes to spend
    real energy, and the longest chain wins.{{cite:nakamoto-whitepaper}} In this release that means greatest <code>nHeight</code>; selecting by cumulative work came later.
    As he wrote on the cryptography mailing list: "The proof-of-work chain is the
    solution to the synchronisation problem, and to knowing what the globally shared
    view is without having to trust anyone."{{cite:nakamoto-mailing-list-sync}}
  </p>
  <p>
    What you are reading is essentially unchanged from Satoshi's original design. Later
    developers optimized performance and patched vulnerabilities, but the fundamental
    architecture—UTXO model, ten-minute blocks, difficulty adjustment, halving schedule,
    longest-chain tip selection—still follows this first release. Tip choice later moved
    from block height to cumulative work; the economic rules did not. More than
    seventeen years later, this is still the DNA of every block that gets mined.
  </p>

annotations:
  # Global state
  - line: 16
    type: margin
    text: "<code class=\"variable\">cs_main</code> — the global mutex. Bitcoin is heavily multi-threaded; this lock protects the blockchain state from race conditions during concurrent access by the network, mining, and UI threads."

  - line: 18
    type: margin
    text: "<code class=\"variable\">mapTransactions</code> — the memory pool (mempool). Unconfirmed transactions wait here after passing validation, until a miner includes them in a block. <code class=\"variable\">nTransactionsUpdated</code> is a generation counter; the mining thread polls it to detect when new transactions arrive and should be considered for the next block."

  - line: 21
    type: margin
    text: "<code class=\"variable\">mapNextTx</code> — in-memory UTXO index. Maps each output being spent (<code class=\"type\">COutPoint</code>) to the transaction spending it (<code class=\"type\">CInPoint</code>). Before a transaction enters the mempool, every input is checked here: if any input already appears in <code class=\"variable\">mapNextTx</code>, another mempool transaction is already spending it — a mempool double-spend."

  - line: 23
    type: margin
    text: "<code class=\"variable\">mapBlockIndex</code> — the in-memory blockchain index. Maps every known block hash to its <code class=\"type\">CBlockIndex</code> (metadata + chain linkage). Loaded from BDB on startup by <code class=\"function\">CTxDB::LoadBlockIndex()</code>. Traversing the chain in either direction is O(1) per step because each <code class=\"type\">CBlockIndex</code> holds pointers to its predecessor (<code class=\"variable\">pprev</code>) and successor (<code class=\"variable\">pnext</code>)."

  - line: 26
    type: margin
    text: "Chain tip state: <code class=\"variable\">nBestHeight</code> is the height of the current best chain (0 = genesis), <code class=\"variable\">hashBestChain</code> is its tip hash, and <code class=\"variable\">pindexBest</code> is a direct pointer to the tip's <code class=\"type\">CBlockIndex</code>. These three values are kept in sync by <code class=\"function\">SetBestChain()</code> and <code class=\"function\">Reorganize()</code>. The mining thread reads <code class=\"variable\">pindexBest</code> to build new block candidates."

  - line: 30
    type: margin
    text: "Orphan blocks — blocks received before their parent. <code class=\"variable\">mapOrphanBlocks</code> indexes them by their own hash; <code class=\"variable\">mapOrphanBlocksByPrev</code> indexes them by their parent's hash. When a new block arrives and connects its parent, the node immediately checks <code class=\"variable\">mapOrphanBlocksByPrev</code> to process any orphans that were waiting for it."

  - line: 36
    type: margin
    text: "<code class=\"variable\">mapWallet</code> — your coins. Maps transaction hashes to <code class=\"type\">CWalletTx</code> (a <code class=\"type\">CTransaction</code> augmented with confirmation status, timestamps, and supporting transaction data). Every transaction you've sent or received lives here. <code class=\"variable\">vWalletUpdated</code> signals the UI thread when the wallet changes."

  - line: 40
    type: margin
    text: "<code class=\"variable\">mapKeys</code> — private key storage. Maps public key bytes to the matching private key. <code class=\"variable\">mapPubKeys</code> maps the 160-bit hash of the public key (the Bitcoin address) back to the full public key — needed to construct spending scripts. Your entire Bitcoin wealth is controlled by what lives in these two maps."

  - line: 43
    type: margin
    text: "<code class=\"variable\">keyUser</code> — the default keypair. The public key is your main Bitcoin address; the private key lets you sign spending transactions. Set once during <code class=\"function\">LoadWallet()</code> from the <code>\"defaultkey\"</code> wallet record. All GUI-initiated payments sign with this key's private key."

  - line: 49
    type: margin
    text: "<code class=\"variable\">fGenerateBitcoins</code> — mining toggle. In v0.01, a typical consumer CPU could find a block in hours to days. Satoshi imagined 'one-CPU-one-vote' as the governance model before GPU mining (2010) and ASICs (2013) made CPU mining irrelevant."

  - line: 50
    type: margin
    text: "<code class=\"variable\">nTransactionFee</code> — optional fee in satoshis. Initially zero. Satoshi designed fees as a spam prevention mechanism: 'Free transactions are nice...until we get slashdotted.' The fee is deducted from the sending wallet's balance; miners collect accumulated fees via <code class=\"function\">GetBlockValue(nFees)</code>."

  # Key management
  - line: 65
    type: margin
    text: "<code class=\"function\">AddKey()</code> — adds a keypair both to the in-memory maps and durably to <code>wallet.dat</code>. Critically, the disk write happens inside the same function call: if the program crashes after updating the map but before the BDB write, the key is lost. The correct order — memory first, then disk — ensures at worst a temporary inconsistency resolved by reloading from disk on restart."

  - line: 75
    type: margin
    text: "<code class=\"function\">GenerateNewKey()</code> — creates a fresh ECDSA keypair on the secp256k1 curve using OpenSSL. The private key is 32 bytes of cryptographically secure random data. The security of every bitcoin stored at the resulting address depends entirely on this randomness — a weak RNG is catastrophic. Satoshi also called <code class=\"function\">RandAddSeed()</code> throughout the codebase to continuously feed entropy into OpenSSL's pool."

  # Wallet update
  - line: 92
    type: margin
    text: "<code class=\"function\">AddToWallet()</code> — idempotent wallet update. If the transaction is new, records the receive time and writes to disk. If already present, merges in any new information: the confirming block hash, merkle branch position, <code class=\"variable\">fFromMe</code> flag, or spent status. This merge logic handles the common case where a transaction is first seen in the mempool, then again when it confirms in a block — the second arrival updates confirmation data without duplicating the record."

  - line: 149
    type: margin
    text: "<code class=\"function\">AddToWalletIfMine()</code> — the filter between the network and your wallet. <code class=\"function\">tx.IsMine()</code> checks whether any output pays to a key you control. If yes, the transaction is wrapped in a <code class=\"type\">CWalletTx</code>, optionally given a merkle branch (if included in a block), and added to the wallet. All received funds flow through this function."

  # Transaction helpers
  - line: 231
    type: margin
    text: "<code class=\"function\">CTxIn::IsMine()</code> — is this input spending our own coin? Looks up the previous transaction in the wallet; if the referenced output paid to a key we control, this input is ours (it's a debit). Used to distinguish 'money I'm sending' from 'money passing through' when calculating wallet balance."

  - line: 247
    type: margin
    text: "<code class=\"function\">CTxIn::GetDebit()</code> — the satoshi value being debited from our wallet by this input. Returns 0 for inputs not ours. Summed across all inputs minus <code class=\"function\">GetCredit()</code> across all outputs gives the net balance change of a transaction."

  - line: 263
    type: margin
    text: "<code class=\"function\">CWalletTx::GetTxTime()</code> — when did this transaction happen? For transactions received directly from the network, use the local arrival time. For transactions learned about through a block, use the block's median time (the median of the previous 11 block timestamps), which filters out miners' timestamp manipulation. Median time is a consensus rule: it can only move forward and is harder to fake than a single block's timestamp."

  - line: 286
    type: margin
    text: "<code class=\"function\">CMerkleTx::SetMerkleBranch()</code> — links a transaction to its containing block via a merkle proof. Stores the block hash, the transaction's index within the block, and the sibling hashes needed to reconstruct the path from this transaction up to the block's merkle root. Returns the confirmation depth (how many blocks have been built on top). The SPV protocol Satoshi described in the whitepaper uses exactly these merkle branches — a lightweight client can verify a transaction is included in a block without downloading the full block.{{cite:nakamoto-whitepaper}}"

  - line: 339
    type: margin
    text: "<code class=\"function\">AddSupportingTransactions()</code> — bundles ancestor transactions with a wallet transaction for relay to peers. When you broadcast a transaction, the recipient might not have the previous transactions your inputs reference. <code>COPY_DEPTH = 3</code> means include up to 3 levels of ancestors. This was Satoshi's pragmatic solution to the 'parent not found' problem before the full mempool relay protocol was robust."

  # Orphan transaction handling
  - line: 185
    type: margin
    text: "<code class=\"function\">AddOrphanTx()</code> - stores transactions whose parents haven't arrived yet. In a P2P network, messages arrive out of order. If transaction B spends transaction A's output, but B arrives first, B is an 'orphan'—valid in isolation but unverifiable without A. Satoshi's solution: store orphans indexed by their missing parent's hash. When A finally arrives, the node can immediately process waiting orphans. The dual maps (<code class=\"variable\">mapOrphanTransactions</code> and <code class=\"variable\">mapOrphanTransactionsByPrev</code>) enable both lookup by orphan hash and efficient retrieval when parents arrive. This pattern—holding incomplete data until dependencies resolve—appears throughout Bitcoin's networking code."

  # Transaction validation
  - line: 406
    type: margin
    text: "<code class=\"function\">AcceptTransaction()</code> - the gatekeeper. Validates syntax, checks inputs exist, verifies signatures. Rejects double-spends before they enter mempool."

  - line: 412
    type: margin
    text: "<code class=\"function\">IsCoinBase()</code> check - coinbase transactions (mining rewards) can only exist in blocks, never broadcast alone. This prevents fake coin creation."

  # Block reward economics
  - line: 677
    type: margin
    text: "50 BTC—the original block reward, equivalent to 5 billion satoshis. Satoshi explained to Mike Hearn in a 2009 email: 'The number of coins and distribution schedule was an educated guess. It was a difficult choice, because once the network is going it's locked in and we're stuck with it.'{{cite:nakamoto-hearn-emails}} He chose 50 as a round number that would produce approximately 21 million total coins via geometric series."

  - line: 680
    type: margin
    text: "The halving formula: <code>nSubsidy >>= (nBestHeight / 210000)</code>. Every 210,000 blocks (~4 years), the reward halves — a geometric series converging on 21 million BTC. There is a subtle bug: once the shift count exceeds the integer width, C++ right-shift behaviour is undefined and the subsidy could reinflate. BIP 42 documented this and soft-forked a finite number of halvings.{{cite:bip-42}}{{cite:rubin-satoshis-version}}"

  # Difficulty adjustment - critical for stability
  - line: 685
    type: margin
    text: "<code class=\"function\">GetNextWorkRequired()</code>—the difficulty adjustment algorithm, perhaps Satoshi's most elegant engineering. Without this, Bitcoin would be unstable: too many miners would create blocks too fast, too few would halt the network. This function automatically adjusts difficulty to maintain the 10-minute average regardless of how much hash power joins or leaves."

  - line: 687
    type: margin
    text: "<code class=\"variable\">nTargetTimespan</code> = 14 days (1,209,600 seconds). Difficulty recalculates every 2016 blocks. Why 2 weeks? Satoshi explained on BitcoinTalk: long enough to smooth out variance (a lucky streak of fast blocks shouldn't swing the retarget too hard), yet short enough to adapt to major hash power changes.{{cite:nakamoto-block-interval}} The code retargets the <em>target</em>: <code>new_target = old_target × (actual_time / target_time)</code>. Difficulty is the inverse, so <code>new_difficulty = old_difficulty × (target_time / actual_time)</code>. If blocks came in 80% of the expected time, difficulty rises 25%."

  - line: 688
    type: margin
    text: "<code class=\"variable\">nTargetSpacing</code> = 10 minutes (600 seconds). Why 10 minutes? Satoshi explained the trade-off: 'Shorter intervals would waste bandwidth and get too hard to keep up downloading all the blocks. Longer intervals would make initial sync faster but increase latency.'{{cite:nakamoto-block-interval}} He also noted that faster blocks cause more 'orphan races' where miners waste work on blocks that get superseded. 10 minutes allows time for blocks to propagate globally before the next is found."

  # Double-spend prevention
  - line: 772
    type: margin
    text: "<code class=\"function\">ConnectInputs()</code> - the double-spend prevention engine. Verifies each input references an unspent output. This is Bitcoin's core innovation."

  - line: 829
    type: margin
    text: "<code class=\"function\">VerifySignature()</code> — script validation call site inside <code class=\"function\">ConnectInputs</code>. After loading the previous tx and enforcing coinbase maturity, each input's <code>scriptSig</code> must satisfy the prior <code>scriptPubKey</code> or the block/tx is rejected."

  - line: 834
    type: margin
    text: "<code>'prev tx already used'</code> - double-spend detected! The transaction tries to spend coins already spent elsewhere. Rejected."

  - line: 918
    type: margin
    text: "<code class=\"function\">DisconnectBlock()</code> — undo a block on reorg: disconnect inputs in reverse order, clear the previous index's <code class=\"variable\">hashNext</code>. The chain can walk backward without rewriting history files."

  - line: 937
    type: margin
    text: "<code class=\"function\">ConnectBlock()</code> — apply a block: assign each tx a disk position, call <code class=\"function\">ConnectInputs</code> (marks UTXOs spent, verifies scripts), enforce coinbase ≤ subsidy+fees. This is where a valid header becomes economic state."

  - line: 953
    type: margin
    text: "Coinbase value check — miner reward cannot exceed <code class=\"function\">GetBlockValue(nFees)</code>. The overflow bug of August 2010 slipped past related value checks elsewhere; this line is the local subsidy cap for a connected block.{{cite:overflow-bug-2010}}"

  # Chain reorganization
  - line: 974
    type: margin
    text: "<code class=\"function\">Reorganize()</code> - handles chain splits. When a longer valid chain appears, Bitcoin switches to it. 'The majority decision is represented by the longest chain.'"

  - line: 991
    type: margin
    text: "<code class=\"variable\">vDisconnect</code> - blocks to undo. During reorg, transactions return to mempool. Users may see confirmations temporarily reverse."

  - line: 996
    type: margin
    text: "<code class=\"variable\">vConnect</code> - blocks to apply. The new chain's transactions take precedence. This is why '6 confirmations' became the security standard."

  # Block validation
  - line: 1154
    type: margin
    text: "<code class=\"function\">CheckBlock()</code> - structural validation. Verifies size limits, timestamp sanity, merkle root, and proof-of-work. Rejects malformed blocks."

  - line: 1180
    type: margin
    text: "<code class=\"variable\">bnProofOfWorkLimit</code> check — rejects a claimed <code class=\"variable\">nBits</code> easier than the minimum difficulty. The target must not exceed <code>~uint256(0) >> 32</code> (all-1s would make proof-of-work trivial)."

  - line: 1192
    type: margin
    text: "<code class=\"function\">AcceptBlock()</code> - adds a validated block to the index. Checks <code class=\"variable\">nBits</code> matches <code class=\"function\">GetNextWorkRequired()</code>, then writes to disk. Reorgs can still disconnect it later."

  - line: 1224
    type: margin
    text: "Commented-out atom minting — before launch, AcceptBlock would extract the coinbase pubkey and grant a random reputation atom to the miner. Collisions were likely in the <code>USHRT_MAX</code> range, and atoms were local-only. Disabled here, the marketplace reputation graph never auto-funded from mining.{{cite:rubin-satoshis-version}}"

  - line: 1236
    type: margin
    text: "<code class=\"function\">ProcessBlock()</code> - main entry point for new blocks. First checks if we've seen it, validates with <code class=\"function\">CheckBlock()</code>, then <code class=\"function\">AcceptBlock()</code> or orphan it."

  - line: 1256
    type: margin
    text: "Orphan storage — if the parent is unknown, park the block in <code class=\"variable\">mapOrphanBlocks</code> / <code class=\"variable\">mapOrphanBlocksByPrev</code> and ask for the missing ancestor. Out-of-order gossip is normal; orphans stitch the DAG until parents arrive."

  - line: 1655
    type: margin
    text: "Partial-message wait — if the declared payload is larger than bytes received, rewind the header and sleep. A peer can advertise a huge <code class=\"variable\">nMessageSize</code> and trickle data, pinning memory in <code class=\"variable\">vRecv</code>. Later versions harden this; v0.01 mostly trusts peers.{{cite:rubin-satoshis-version}}"

  # P2P message handlers
  - line: 1705
    type: margin
    text: "<code>\"version\"</code> handshake — first message on a connection; anything else is rejected until this succeeds. Negotiates protocol version, services bits, and peer time.{{cite:rubin-satoshis-version}}"

  - line: 1720
    type: margin
    text: "<code class=\"variable\">fClient</code> / <code class=\"constant\">SER_BLOCKHEADERONLY</code> — peers without <code>NODE_NETWORK</code> are treated as lightweight clients and only receive block headers, not full blocks.{{cite:rubin-satoshis-version}}"

  - line: 1727
    type: margin
    text: "<code class=\"function\">AddTimeData()</code> — peer clocks influence our adjusted network time. A minority of dishonest peers cannot easily skew the median, but the design still trusts the peer set for time.{{cite:rubin-satoshis-version}}"

  - line: 1729
    type: margin
    text: "<code class=\"variable\">fAskedForBlocks</code> — ask the <em>first</em> full node for <code>getblocks</code>, then never again. Satoshi noted (via later annotation) we should cross-check other peers in case this one lies — but v0.01 does not.{{cite:rubin-satoshis-version}}"

  - line: 1748
    type: margin
    text: "<code>\"addr\"</code> — peer gossip. Incoming addresses are stored via <code class=\"function\">AddAddress</code> so the node can reconnect after IRC or restart without rediscovering the whole network."

  - line: 1772
    type: margin
    text: "<code>\"inv\"</code> — inventory advertisement. For each unknown <code class=\"type\">CInv</code>, call <code class=\"function\">AskFor</code>; if we already have an orphan block, request the parent chain with <code>getblocks</code>. This is how transactions and blocks flood the mesh without flooding full payloads first."

  - line: 1795
    type: margin
    text: "<code>\"getdata\"</code> — fetch request. Serve blocks from disk (headers-only for lightweight clients) or relayed objects from <code class=\"variable\">mapRelay</code>. Peers pull after <code>inv</code>; they are never pushed full blocks unsolicited in this design."

  - line: 1832
    type: margin
    text: "<code>\"getblocks\"</code> — sync handshake. Locator finds a common ancestor; we queue <code>inv</code> entries for subsequent best-chain blocks until <code class=\"variable\">hashStop</code>. Exponential locator spacing keeps the message small even for long histories."

  - line: 1868
    type: margin
    text: "<code>\"tx\"</code> — full transaction payload. Validate, accept into the memory pool / wallet paths, relay to peers, and recursively process any orphan txs that were waiting on this one's outputs."

  - line: 1921
    type: margin
    text: "<code>\"review\"</code> — marketplace reputation message. Signed attestations with stars and atoms for the unfinished eBay-style system; relayed if <code class=\"function\">AcceptReview()</code> succeeds.{{cite:rubin-satoshis-version}}"

  - line: 1939
    type: margin
    text: "<code>\"block\"</code> — full block payload. Deserialized then handed to <code class=\"function\">ProcessBlock</code>. Debug <code>print()</code> of every received block is left in — early-network forensics gold."

  - line: 1955
    type: margin
    text: "<code>\"getaddr\"</code> — request recent peer addresses (last hour). Keeps the addr database fresh without relying solely on IRC."

  - line: 1974
    type: margin
    text: "<code>\"checkorder\"</code> — IP-to-IP payment handshake. Peer proposes an order; we return approval plus a fresh pubkey (reused per IP until spent). Deprecated with the marketplace/payment UX.{{cite:rubin-satoshis-version}}"

  - line: 1993
    type: margin
    text: "<code>\"submitorder\"</code> — after checkorder, the payer sends the signed wallet tx. We accept into the wallet, relay, and <code>\"reply\"</code> success or failure.{{cite:rubin-satoshis-version}}"

  - line: 2015
    type: margin
    text: "<code>\"reply\"</code> — dynamic dispatch: a nonce routes the payload to a pending <code class=\"type\">CRequestTracker</code> callback. Request/response over the P2P socket without a separate RPC channel.{{cite:rubin-satoshis-version}}"

  - line: 2410
    type: margin
    text: "<code class=\"function\">SelectCoins()</code> — coin selection. Prefer a combination of smaller unspent credits that sum to the target; fall back to the smallest larger coin. Stochastic subset search appears below — the ancestor of every modern coin-selection algorithm."

  - line: 2514
    type: margin
    text: "<code class=\"function\">CreateTransaction()</code> — build a payment: select coins, add change back to <code class=\"variable\">keyUser</code>, sign inputs, compute fee. Returns the fee required if the first attempt underpays — the GUI can retry."

  - line: 2625
    type: margin
    text: "<code class=\"function\">SendMoney()</code> — end-to-end spend: create, commit spent flags, accept into wallet, relay. The function every \"Send\" button ultimately calls."

  # Genesis block - the beginning
  - line: 1439
    type: margin
    text: "Genesis Block creation. Satoshi hardcoded this first block. The hash was computed offline; this code just reconstructs it for verification."

  - line: 1449
    type: block
    title: "Satoshi's Debug Output"
    text: "These comments are Satoshi's own debug output, preserved as documentation. The format <code>CBlock(hash=000000000019d6...)</code> matches the <code>print()</code> method output. This archaeological artifact reveals several things:

      <p><strong>The block hash:</strong> <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code>—note how it starts with many zeros. This is proof-of-work in action: the winning <code>nNonce</code> is ~2.08×10⁹, and at this target expected work is on the order of 2³² hashes. The leading zeros aren't just formatting; they represent the computational work that secures the block.</p>

      <p><strong>The merkle root:</strong> <code>4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b</code>—a hash of all transactions in the block (just the one coinbase transaction here). Every transaction ID in Bitcoin begins with this same merkle tree construction.</p>

      <p><strong>The timestamp:</strong> <code>nTime=1231006505</code> is Unix epoch time for Saturday, January 3, 2009, 6:15:05 PM GMT. This was approximately 6 days after the whitepaper's timestamp and likely when Satoshi successfully mined this block after days of testing.</p>

      <p><strong>The coinbase hex:</strong> In the CTxIn line, <code>04ffff001d0104455468652054696d6573...</code> is the scriptSig. Decoding: <code>04ffff001d</code> pushes <code>nBits</code> (<code>0x1d00ffff</code>), <code>01 04</code> pushes the script integer <code>4</code> (from <code>CBigNum(4)</code> in the genesis constructor—not an ExtraNonce), then <code>45</code> (69 in decimal) pushes 69 bytes—the ASCII 'The Times 03/Jan/2009...' headline. You can verify: <code>54686520</code> = 'The ' in ASCII.</p>

      <p><strong>The unspendable output:</strong> The 50 BTC sent to scriptPubKey <code>0x5F1DF16B2B704C8A578D0B...</code> has never moved and never will. The genesis block's coinbase wasn't added to the UTXO database—possibly a bug, possibly intentional. Those 50 BTC are cryptographic ghosts, visible on the chain but impossible to spend.</p>"

  - line: 1456
    type: block
    title: "The Genesis Block"
    text: "'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks'—Satoshi's timestamp proof embedded in the coinbase. This headline from the Times of London serves two purposes: (1) it proves the genesis block wasn't pre-mined before January 3, 2009, and (2) it's a political statement about why Bitcoin exists. The 2008 financial crisis, bank bailouts, and quantitative easing motivated Satoshi to create an alternative: 'The root problem with conventional currency is all the trust that's required to make it work.'

      <p style=\"margin-top: 1em;\"><strong>Genesis Block Hex Dump (285 bytes):</strong></p>
      <pre style=\"font-size: 0.75em; word-break: break-all; white-space: pre-wrap;\"></pre>

      <p style=\"margin-top: 0.5em;\"><strong>Decoded structure:</strong></p>
      <pre style=\"font-size: 0.7em;\">
      Header (80 bytes):
        01000000 ........................... Version 1
        00000000000000000000000000000000
        00000000000000000000000000000000 ... Previous block (null)
        3ba3edfd7a7b12b27ac72c3e67768f61
        7fc81bc3888a51323a9fb8aa4b1e5e4a ... Merkle root
        29ab5f49 ........................... Time: 1231006505 (Jan 3, 2009 18:15:05 UTC)
        ffff001d ........................... Bits (compact target)
        1dac2b7c ........................... Nonce: 2083236893

      Transaction:
        01 ................................. TX count (1)
        01000000 ........................... TX version
        01 ................................. Input count
        00000000...00000000 ................ Null outpoint (coinbase)
        ffffffff ........................... Sequence
        4d ................................. Script length (77 bytes)
        04ffff001d0104455468652054696d6573
        2030332f4a616e2f323030392043686...  Coinbase script (contains headline)
        ffffffff ........................... Sequence
        01 ................................. Output count
        00f2052a01000000 ................... 50 BTC (5,000,000,000 satoshis)
        43 ................................. Script length (67 bytes)
        41...ac ............................ Pay-to-pubkey script
        00000000 ........................... Lock time
      </pre>"

  - line: 1461
    type: margin
    text: "<code>50 * COIN</code>—the first 50 bitcoins ever created, worth exactly $0 at the time (and now worth millions). Curiously, these specific coins are permanently unspendable due to a quirk: the genesis block's coinbase transaction isn't indexed in the UTXO database. Whether this was intentional or an oversight is unknown. Satoshi never commented on it, and no one has ever been able to ask."

  - line: 1465
    type: margin
    text: "<code class=\"variable\">hashPrevBlock</code> = 0—the genesis block's defining characteristic. Every other block must reference a valid previous block; this is the only block that points to nothing. The all-zeros hash is Bitcoin's 'Big Bang moment'—the chain has to start somewhere. Genesis is loaded specially in <code class=\"function\">LoadBlockIndex</code>; any later block with an unknown parent (including <code>hashPrevBlock = 0</code>) fails <code class=\"function\">AcceptBlock</code> with 'prev block not found.'"

  - line: 1469
    type: margin
    text: "<code class=\"variable\">nBits</code> = <code>0x1d00ffff</code>—the initial difficulty target in compact format. This expands to a 256-bit target where valid hashes must start with approximately 32 zero bits. At this difficulty, Satoshi's circa-2008 computer (likely a modest desktop or laptop) could find valid blocks in minutes to hours. For comparison: today's network runs at difficulty requiring ~80+ leading zero bits, approximately 10^13 times harder."

  - line: 1470
    type: margin
    text: "<code class=\"variable\">nNonce</code> = <code>2083236893</code>—the winning nonce hardcoded into every client (nonce means 'number used once'). At this target, expected work is ~2³² hashes; the nonce value itself is not a proven attempt count. The resulting hash <code>000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f</code> starts with the required zeros, proving work was done."

  # Mining
  - line: 2183
    type: margin
    text: "<code class=\"function\">BitcoinMiner()</code> - the mining function. Satoshi envisioned 'one-CPU-one-vote' democracy. In 2009, anyone's laptop could mine blocks. Forensics of the first ~170 blocks show how fragile that democracy was: long gaps between blocks imply the network sometimes halted entirely when Satoshi stopped mining.{{cite:waltz-1stbitcoinminer}}{{cite:waltz-1stbitcoinminer-transcriptions}}"

  - line: 2186
    type: margin
    text: "<code class=\"constant\">THREAD_PRIORITY_LOWEST</code> - mining runs in background. Satoshi wanted mining to not interfere with normal computer use."

  - line: 2190
    type: margin
    text: "<code class=\"variable\">bnExtraNonce = 0</code> — initialized <em>once</em>, outside the <code>while (fGenerateBitcoins)</code> loop. It does not reset after a block is found; only a client restart zeroes it. Lerner’s Patoshi analysis treats that free-running counter as privacy flaw #1: consecutive coinbases from the same process form a rising ExtraNonce timeline that links ~22k early blocks to one miner.{{cite:bitslog-patoshi}}{{cite:waltz-1stbitcoinminer}}{{cite:rubin-satoshis-version}}"

  - line: 2195
    type: margin
    text: "<code>while (vNodes.empty())</code> — the miner refuses to work until at least one peer is connected. Alone, a node would mine an orphan chain nobody else sees. In the first days that check mattered: Hal Finney's <code>debug.log</code> shows he joined near block 49 and saw only two other peers — both consistent with Satoshi running multiple nodes.{{cite:finney-crash-debuglog-2009}}{{cite:waltz-1stbitcoinminer}}"

  - line: 2203
    type: margin
    text: "<code class=\"function\">GetNextWorkRequired()</code> - fetches the current compact target (<code class=\"variable\">nBits</code>). Miner must find <code>hash ≤ target</code>. Higher difficulty = smaller target = harder."

  - line: 2211
    type: margin
    text: "<code>prevout.SetNull()</code>—the signature of money creation. Normal transactions must reference a previous output to spend; coinbase transactions reference nothing because they create coins from thin air. <code class=\"function\">SetNull()</code> sets <code>hash=0</code> and <code>index=-1</code>, a combination that can never occur naturally (no real transaction has hash 0). This null reference is how nodes identify coinbase transactions. It's the only way new bitcoin enters circulation—every satoshi in existence traces back through a chain of transactions to some block's coinbase with this null <code class=\"variable\">prevout</code>."

  - line: 2212
    type: margin
    text: "<code class=\"variable\">++bnExtraNonce</code> in the coinbase <code>scriptSig</code> — runs whenever this process builds a new template: after <code class=\"variable\">nNonce</code> overflow, after the tip moves, or when the mempool changes enough to rebuild. Fresh ExtraNonce entropy changes the merkle root and expands the search space beyond 2³² header nonces. For stock v0.1 miners, each new network tip forces a rebuild, so ExtraNonce often advances roughly once per block seen (Lerner’s privacy flaw #3)—which is why non-Patoshi slopes track the chain, while Patoshi’s denser slope stands out.{{cite:bitslog-patoshi}}{{cite:waltz-1stbitcoinminer-transcriptions}}"

  - line: 2237
    type: margin
    text: "Template packing loop stops around <code>MAX_SIZE/2</code> (~16 MB). Size is checked before each add, but a single oversized transaction can still push <code class=\"variable\">nBlockSize</code> past <code>MAX_SIZE</code> — a latent packing bug noted in annotated v0.01 walkthroughs.{{cite:rubin-satoshis-version}}"

  - line: 2252
    type: margin
    text: "Satoshi's fee discount for early transactions. The boolean <code>pblock->vtx.size() < 100</code> grants a discount to the first 100 transactions in a block: if under 10KB, they're free. After 100 transactions, everyone pays 0.01 BTC/KB. This was flood control—allow normal usage for free, but charge when blocks fill up. Satoshi wrote: 'Free transactions are nice...until we get slashdotted.'{{cite:nakamoto-free-transactions}} The threshold of 100 transactions and 10KB were educated guesses; modern Bitcoin uses more sophisticated fee markets where users bid for block space."

  - line: 2267
    type: margin
    text: "<code class=\"function\">GetBlockValue(nFees)</code> - calculates reward. Block subsidy plus all transaction fees. Fees incentivize miners after subsidy halves to zero."

  - line: 2307
    type: margin
    text: "<code class=\"variable\">hashTarget</code> - the PoW threshold decoded from <code class=\"variable\">nBits</code>. Hash must be ≤ this 256-bit number. Lower target = harder puzzle."

  - line: 2309
    type: margin
    text: "The mining loop. Increment <code class=\"variable\">nNonce</code>, double-SHA256 the header, compare to target. Every <code>0x40000</code> nonces (~every few seconds on a 2009 CPU) the inner loop also refreshes <code class=\"variable\">nTime</code> and checks whether the tip moved—see below."

  - line: 2311
    type: margin
    text: "<code class=\"function\">BlockSHA256()</code> - optimized SHA-256 for mining. Called millions of times per second. Performance here directly affects mining revenue."

  - line: 2315
    type: margin
    text: "<code>hash <= hashTarget</code> - FOUND IT! This comparison is why mining works: finding a hash ≤ target is rare and proves work was done."

  - line: 2322
    type: margin
    text: "'proof-of-work found' - victory message. Satoshi: 'The proof-of-work also solves the problem of determining representation in majority decision making.'"

  - line: 2344
    type: margin
    text: "<code>(++nNonce &amp; 0x3ffff) == 0</code> — throttle: only every 2¹⁸ nonces does the miner leave the hot path. That cadence (~10s on period hardware) is where timestamps catch up and where tip/mempool abort checks run. Lerner uses these lagged timestamps in the clock-inversion argument: a single machine almost never publishes a child with an earlier <code class=\"variable\">nTime</code> than its own parent—and across the first 50k blocks, Patoshi→Patoshi inversions are zero.{{cite:bitslog-patoshi}}"

  - line: 2347
    type: margin
    text: "<code>nNonce == 0</code> after the increment — 32-bit overflow. Break, rebuild the template, and <code>++bnExtraNonce</code>. At the initial target (~2³² expected hashes per block), overflow was uncommon but real; ExtraNonce exists so mining can continue past a full nonce sweep."

  - line: 2349
    type: margin
    text: "<code>pindexPrev != pindexBest</code> — another miner’s block (or our own, after <code class=\"function\">ProcessBlock</code>) moved the tip. Abort this template; the outer loop will mint a fresh coinbase and bump ExtraNonce. That tip-driven rebuild is how stock clients imprint “blocks seen” onto ExtraNonce slopes.{{cite:bitslog-patoshi}}"

  - line: 2355
    type: margin
    text: "Refresh <code class=\"variable\">nTime</code> from <code class=\"function\">GetAdjustedTime()</code> (floored by median-time-past+1). Timestamps are <em>not</em> updated every hash—only on this throttle—so a slow parent can leave a child looking slightly “early.” Combined with peer median-time adjustment, that explains most observed timestamp inversions between <em>different</em> miners.{{cite:bitslog-patoshi}}"

