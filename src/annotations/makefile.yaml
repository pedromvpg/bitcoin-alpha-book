# Annotation for makefile - Build Configuration (Unix)
file: "makefile"

title: "Assembly Required (Unix)"

introduction: |
  <p>
    The makefile tells the compiler how to build Bitcoin on Unix-like
    systems. It lists all source files, compiler flags, and library
    dependencies needed to produce the bitcoin executable.
  </p>

