# Annotation for market.cpp - The Built-in Marketplace
file: "market.cpp"

title: "The Road Not Taken"

introduction: |
  <p>
    This file is one of the most fascinating archaeological artifacts in Bitcoin's
    codebase: a partially-implemented eBay-style marketplace that Satoshi planned to
    build directly into the Bitcoin client. Products, reviews, seller reputation -- all
    embedded in the same application that managed your wallet and mined blocks. It is
    the clearest window into Satoshi's original vision of Bitcoin as a <em>complete
    economic system</em>, not merely a currency.
  </p>
  <p>
    In a 2011 email to Mike Hearn, Satoshi explained: "I was trying to implement an
    eBay style marketplace built in to the client. Publish/subscribe would be used
    for broadcasting product offers and ratings/reviews. Your reviews would be
    weighted by the blocks you've generated."{{cite:nakamoto-hearn-emails}} The marketplace
    code uses a novel "atom" propagation system -- a form of trust diffusion where
    reputation flows through a social graph of reviewers. A seller gains atoms when a
    user reviews them; those atoms propagate outward through subsequent links, decaying as
    they spread. This was Satoshi's attempt to solve the reputation bootstrapping
    problem without a central authority.
  </p>
  <p>
    The code was never completed. Commented-out notification callbacks, TODO comments
    about persistence (<code>//// later figure out how these are persisted</code>),
    and dead code blocks reveal a feature abandoned mid-development. Even the supply of
    reputation was unfinished: <code>AcceptBlock</code> in <code>main.cpp</code> still
    contains commented-out logic that would mint a random atom for whoever mined a
    block — disabled before launch, so atoms never auto-issued from mining.{{cite:rubin-satoshis-version}}
    Satoshi ultimately decided to focus on getting the core payment system right before
    layering commerce on top. The marketplace was stripped from later releases
    entirely.{{cite:bitcoin-core-history}} Projects like OpenBazaar (2014) and Bisq (2019)
    would independently reinvent this concept years later -- peer-to-peer commerce with
    decentralized reputation -- without knowing Satoshi had prototyped it in January
    2009.{{cite:nakamoto-institute-code}}
  </p>
  <p>
    What remains is 264 lines of C++ that reveal a mind thinking far beyond digital
    cash. Satoshi was designing an entire trustless economy: money, commerce, and
    reputation, all woven together. The marketplace failed as software, but it
    succeeded as prophecy.
  </p>

annotations:
  - line: 20
    type: margin
    text: "<code>//// later figure out how these are persisted</code> -- Satoshi's own TODO comment, preserved verbatim. This reveals the marketplace was still in the design phase when v0.01 shipped. <code class=\"variable\">mapMyProducts</code> holds your own listed products in memory, but there is no code to save them to disk. Restart the client and your listings vanish. Satoshi never got around to adding BDB persistence for marketplace data the way he did for wallet transactions."

  - line: 26
    type: margin
    text: "<code class=\"variable\">mapProducts</code> -- the global product catalog, mapping product hashes to <code class=\"type\">CProduct</code> objects. This is the marketplace equivalent of <code class=\"variable\">mapTransactions</code> (the mempool). Products from all sellers across the network would live here. <code class=\"variable\">cs_mapProducts</code> is the mutex protecting it from concurrent access -- the same threading pattern used throughout Bitcoin's core."

  - line: 29
    type: margin
    text: "<code class=\"function\">AdvertInsert()</code> -- adds or updates a product listing in the global marketplace. The logic is idempotent: if the product hash already exists, it only overwrites when the incoming <code class=\"variable\">nSequence</code> number is higher (line 43), preventing stale advertisements from overwriting newer ones. This sequence-number versioning is the same pattern used in IP address relay -- a simple but effective way to handle out-of-order message delivery in a P2P network."

  - line: 50
    type: margin
    text: "Three commented-out notification callbacks: <code class=\"function\">NotifyProductAdded</code>, <code class=\"function\">NotifyProductUpdated</code>, <code class=\"function\">NotifyProductDeleted</code>. These would have triggered UI updates when the marketplace changed -- the same observer pattern used by the wallet's <code class=\"variable\">vWalletUpdated</code> signal. The fact that they are stubbed out but never implemented confirms this feature was abandoned before the UI integration was complete."

  - line: 58
    type: margin
    text: "<code class=\"function\">AdvertErase()</code> -- removes a product listing. Only six lines, using the same <code>CRITICAL_BLOCK</code> locking pattern found everywhere in Bitcoin. The commented-out <code class=\"function\">NotifyProductDeleted</code> call again shows incomplete UI wiring."

  - line: 84
    type: margin
    text: "<code class=\"function\">Union()</code> -- a generic sorted-set-union utility. The commented-out block above (lines 91-96) is Satoshi's earlier attempt using <code class=\"function\">std::set_union</code> with erase, replaced by the cleaner <code class=\"function\">back_inserter</code> version. He left the old code as a note to himself: <code>///// need to check that this is equivalent, then delete this comment</code>. He never came back to clean it up -- another sign of code frozen mid-development."

  - line: 109
    type: margin
    text: "<code class=\"function\">CUser::AddAtom()</code> -- the heart of Satoshi's reputation diffusion algorithm. Each user maintains three vectors: <code class=\"variable\">vAtomsIn</code> (received atoms, sorted), <code class=\"variable\">vAtomsNew</code> (pending atoms, unsorted), and <code class=\"variable\">vAtomsOut</code> (atoms forwarded to downstream users). When a user accumulates enough new atoms (reaching <code class=\"variable\">nFlowthroughRate</code>, set to 2 in market.h), a random atom is selected to propagate outward. This stochastic forwarding creates a trust signal that decays with social distance -- reviewers close to you carry more weight than distant strangers."

  - line: 120
    type: margin
    text: "The zero atom (<code>nAtom == 0</code>) is special: it never propagates beyond the immediate recipient. Satoshi's comment explains this was a placeholder: <code>//// instead of zero atom, should change to free atom that propagates, limited to lower than a certain value like 5</code>. The design was still evolving. The <code class=\"variable\">fOrigin</code> flag marks atoms created by the user themselves, which always propagate -- you always vouch for your own reputation."

  - line: 143
    type: margin
    text: "<code class=\"function\">AddAtomsAndPropagate()</code> -- breadth-first propagation through the social graph. Uses a double-buffer technique: <code class=\"variable\">pmapPropagate[2]</code> alternates between 'current wave' and 'next wave' using <code>side = 1 - side</code> (line 149). For each user in the current wave, atoms are added via <code class=\"function\">AddAtom()</code>; any newly-generated outgoing atoms are queued for the next wave across all of that user's <code class=\"variable\">vLinksOut</code>. The propagation stops naturally when no user produces new outgoing atoms. This is essentially a flood-fill algorithm over a directed trust graph, persisted through <code class=\"type\">CReviewDB</code>."

  - line: 197
    type: margin
    text: "<code class=\"function\">CReview::AcceptReview()</code> -- validates and stores a user review. The sequence is: (1) timestamp it with current time, (2) verify the ECDSA signature against the reviewer's public key using the same <code class=\"function\">CKey::Verify()</code> used for transaction signatures, (3) append the review to the recipient's review list in BDB, (4) add a social link from reviewer to recipient, and (5) propagate reputation atoms. Reviews are cryptographically signed -- you cannot forge a review from someone else's identity. This is the same authentication model as Bitcoin transactions, applied to social trust."

  - line: 226
    type: margin
    text: "When propagating atoms after a review, if the reviewer has no atoms of their own, a 'zero atom' vector is sent instead (line 227). This ensures that even a brand-new user with no reputation can still create a link in the trust graph. The zero atom, which does not propagate further, acts as a minimal seed -- acknowledging the connection exists without granting transitive reputation."

  - line: 237
    type: margin
    text: "<code class=\"function\">CProduct::CheckSignature()</code> and <code class=\"function\">CProduct::CheckProduct()</code> -- product validation. Like transactions, product listings are cryptographically signed by the seller. <code class=\"function\">CheckProduct()</code> enforces that only 'summary' products (no details or order form data) pass validation -- detailed product information would presumably be fetched on demand to save bandwidth. The seller's atom count is looked up from the review database (line 255), giving each product a reputation score derived from the trust graph."

conclusion: |
  <p>
    The marketplace code reveals that Satoshi's ambition extended far beyond digital
    cash. He was building a decentralized commerce platform where products, reviews,
    and reputation all operated without trusted intermediaries. The atom propagation
    system -- a form of trust diffusion through social graphs -- was a genuinely novel
    approach to decentralized reputation, years ahead of its time.
  </p>
  <p>
    The decision to abandon this feature was arguably one of the most important
    editorial choices in Bitcoin's history. By shipping a focused, minimal product --
    send money, receive money, mine blocks -- Satoshi ensured the core payment
    protocol was robust before layering complexity on top. Had the marketplace
    shipped in its half-finished state, bugs in the reputation system could have
    undermined confidence in Bitcoin itself.
  </p>
  <p>
    The marketplace's ghost lives on in Bitcoin's DNA. The <code class=\"type\">CProduct</code>
    and <code class=\"type\">CReview</code> classes are still compiled into v0.01. The
    UI has product listing dialogs (see ui.h). The P2P protocol has message types for
    advertising products. All of it functional enough to hint at what might have been,
    incomplete enough to remind us that even Satoshi had to choose what to ship and
    what to cut.
  </p>
