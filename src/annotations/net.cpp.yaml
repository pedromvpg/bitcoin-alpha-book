# Annotation for net.cpp - Peer-to-Peer Networking
file: "net.cpp"

title: "The Gossip Network"

introduction: |
  <p>
    Bitcoin operates as a peer-to-peer network with no central server. This file
    implements all networking: node discovery, connection management, message
    routing, and the gossip protocol that propagates transactions and blocks
    across the globe in seconds. At any moment, thousands of nodes are running
    descendants of this code, forming the backbone of the Bitcoin network.
  </p>
  <p>
    Satoshi's design goal from the whitepaper's opening line: "A purely peer-to-peer
    version of electronic cash would allow online payments to be sent directly from
    one party to another without going through a financial institution."{{cite:nakamoto-whitepaper}} This file
    makes that vision technically possible. There's no Bitcoin Inc. server—just
    a mesh of equal peers, each running the same rules.
  </p>
  <p>
    The network is resilient by design. Nodes join and leave freely. Messages
    propagate via gossip—each node tells its neighbors, who tell theirs. If half
    the network vanished tomorrow, the other half would continue producing blocks
    (slowly at first, until the difficulty adjusted). This architecture has survived government crackdowns, DDoS attacks,
    and internet outages across seventeen years without a single hour of downtime.
  </p>
  <p>
    The protocol uses a simple message format: 4-byte magic number (to identify
    the Bitcoin network), 12-byte command name, 4-byte payload size, then
    the payload. Messages include: "version" (handshake), "addr"
    (peer addresses), "inv" (announce data), "getdata" (request data), "tx"
    (transaction), "block" (block data). This simplicity enabled implementations
    in dozens of languages.
  </p>

annotations:
  - line: 20
    type: margin
    text: "<code>fClient</code> — whether to run in lightweight mode without full blockchain. If true, NODE_NETWORK bit is cleared from nLocalServices, signaling to peers that this node cannot serve historical blocks."

  - line: 21
    type: margin
    text: "<code>nLocalServices</code> — bitmask of capabilities advertised to peers. NODE_NETWORK (bit 0) means the node stores and serves the full blockchain. Nodes use this to decide which peers to ask for block data."

  - line: 26
    type: margin
    text: "<code class=\"variable\">vfThreadRunning</code> — status flags for the four worker threads (0 socket, 1 open-connections, 2 message-handler, 3 miner). Plain <code>bool</code>s, not atomics — fine on the single-writer pattern Satoshi used, fragile by modern standards.{{cite:rubin-satoshis-version}}"

  - line: 27
    type: margin
    text: "<code>vNodes</code> — the live peer roster. Every TCP connection to another Bitcoin node is represented here as a CNode*. The socket handler, message handler, and connection opener all share this list via cs_vNodes. In v0.01 the connection opener stops seeking new peers once vNodes reaches 15."

  - line: 29
    type: margin
    text: "<code>mapAddresses</code> — the address book of known peers. Keys are serialized IP+port; values are CAddress structs with last-seen time and service flags. Persisted to addr.dat on disk so peers survive restarts."

  - line: 31
    type: margin
    text: "<code>mapRelay</code> — short-lived cache for relayed objects. When a node broadcasts a transaction it stores it here for 15 minutes so peers who ask for it via getdata can receive it. vRelayExpiration tracks when entries expire."

  - line: 34
    type: margin
    text: "<code>mapAlreadyAskedFor</code> — throttles duplicate requests. When we ask a peer for an object (by CInv hash), we record the time here. If another peer announces the same object, we skip asking until the timeout expires — preventing bandwidth waste."

  - line: 40
    type: margin
    text: "<code>ConnectSocket</code> — creates a raw TCP connection to another node. Checks whether the target IP is a private (RFC 1918) address; if a SOCKS4 proxy is configured and the target is routable, routes through it instead of connecting directly."

  - line: 48
    type: margin
    text: "Private IP detection: 10.x.x.x and 192.168.x.x are RFC 1918 private ranges, not routable on the public internet. Satoshi skips proxy for private IPs since they're presumably on the same LAN."

  - line: 61
    type: margin
    text: "SOCKS4 handshake: the 13-byte request encodes VN=4, CD=1 (CONNECT), the destination port (big-endian), and IP (4 bytes). The string \"user\" is a null-terminated USERID field. A 0x5A response byte means the proxy accepted the connection."

  - line: 92
    type: margin
    text: "<code>GetMyExternalIP</code> — discovers the node's public IP by HTTP GET to whatismyip.com. Needed behind NAT so peers can dial inbound. The service has no obligation to reply faithfully — a quiet trust dependency on a third party for identity.{{cite:rubin-satoshis-version}}"

  - line: 136
    type: margin
    text: "<code>AddAddress</code> — adds a peer to the address book, deduplicating by key. Only stores routable (public internet) IPs; ignores our own address. If services bits have expanded for a known address, updates the record."

  - line: 209
    type: margin
    text: "Pub/sub system — Bitcoin v0.01 included a publish-subscribe layer for relaying marketplace messages (products and orders). Nodes could subscribe to channels (MSG_TABLE, MSG_PRODUCT) and receive broadcasts from any subscriber. This was the embryo of an online marketplace — and only half of it was built: v0.01 sends <code>subscribe</code> and <code>publish</code> messages, but <code>ProcessMessage</code> in main.cpp has no handler for them, so a receiving node logs 'Ignored unknown message' and drops them. The marketplace code (market.cpp) was gone by v0.3.0.{{cite:bitcoin-core-history}}"

  - line: 227
    type: margin
    text: "<code>CNode::Subscribe</code> — if no other node is currently subscribed to a channel, propagates a \"subscribe\" message to all peers (meet-in-the-middle relay). The comment calculates that with 100,000 nodes each subscribing to 1,000 random peers, 99.995% message delivery is achievable."

  - line: 277
    type: margin
    text: "<code>FindNode</code> — O(n) search through vNodes. With at most a few dozen peers (the opener stops at 15) this is fast enough. Returns the CNode* if connected, NULL otherwise. Two overloads: one searches by raw IP, the other by full CAddress (IP+port)."

  - line: 299
    type: margin
    text: "<code>ConnectNode</code> — high-level peer connection: returns existing connection if already connected, otherwise calls ConnectSocket and creates a new CNode, adding it to vNodes. On failure, records the current time as nLastFailed to implement retry backoff."

  - line: 395
    type: margin
    text: "<code>ThreadSocketHandler2</code> — the I/O engine. Runs in a dedicated thread, looping forever. Each iteration: disconnect stale nodes, call select() to wait for socket readiness, accept inbound connections, then read/write data for every active socket. The Sleep(10) at the end yields the CPU briefly each cycle."

  - line: 410
    type: margin
    text: "Duplicate connection resolution: if two nodes connect to each other simultaneously, both would keep a duplicate. Only the lower-IP node runs the dedup; it keeps the better-connected <code class=\"type\">CNode</code> and marks the extra for disconnect — anti-symmetric, so both sides do not fight.{{cite:rubin-satoshis-version}}"

  - line: 444
    type: margin
    text: "<code>ReadyToDisconnect()</code> is true when the node is flagged <code>fDisconnect</code> or its reference count has dropped to zero; this line additionally requires both send/receive buffers to be empty before closing. Disconnected nodes are held in a pool for at least 5 minutes (longer if threads still hold references) before deletion."

  - line: 488
    type: margin
    text: "<code>select()</code> multiplexing — classic Unix network I/O. Builds fd_sets for all active sockets plus the listening socket, then blocks for up to 50ms waiting for any socket to become readable or writable. Avoids spinning and keeps CPU usage low while watching many connections simultaneously."

  - line: 541
    type: margin
    text: "Accept inbound connections: when the listening socket fires in the read set, accept() pulls the pending connection off the kernel queue, creates a CNode marked fInbound=true (inbound), and adds it to vNodes. Inbound nodes are treated identically to outbound ones."

  - line: 577
    type: margin
    text: "Receive path: reads up to 64 KB from the socket into pnode->vRecv in one syscall. A zero return means the remote end closed the connection gracefully; negative means a socket error. Data accumulates in vRecv until ThreadMessageHandler processes complete messages."

  - line: 613
    type: margin
    text: "Send path: flushes as much of vSend as the kernel will accept in one send() call, then erases the bytes sent. Unsent bytes remain in vSend, so partial sends are handled correctly. Only marked writable (fdsetSend) if vSend is non-empty."

  - line: 673
    type: margin
    text: "<code>ThreadOpenConnections2</code> — proactively seeks new peers when below nMaxConnections (15). Selects from mapAddresses using the class-C diversity algorithm below. Once connected, sends our address and requests more addresses with \"getaddr\"."

  - line: 693
    type: margin
    text: "Class-C diversity algorithm: groups known IPs by /24 subnet. When choosing a peer, first picks a random /24, then a random IP within it. This means an attacker flooding with 255 IPs in one subnet gets the same share of attention as a single legitimate node in another subnet — Sybil resistance through IP diversity."

  - line: 735
    type: margin
    text: "Retry delay for peers that failed before — scaled by how many peers you already have, not by how many times the address failed. nDelay starts at 30 minutes with no connections and doubles with each connection in vNodes — with 8 peers it would be 30 min × 2^8 = 128 hours, capped at 8 hours. So a lonely node retries aggressively; a well-connected one is picky. nRandomizer (derived from the address and its failure time) scales each address's wait between 0 and 2× nDelay so retries are staggered. An address that has never failed (nLastFailed = 0) gets a randomizer of 0 and is always eligible."

  - line: 816
    type: margin
    text: "<code>ThreadMessageHandler2</code> — protocol dispatch loop. Runs at THREAD_PRIORITY_BELOW_NORMAL to avoid starving the I/O thread. Every 100ms, iterates all peers: calls ProcessMessages to handle received data, then SendMessages to queue outbound protocol messages."

  - line: 819
    type: margin
    text: "<code>THREAD_PRIORITY_BELOW_NORMAL</code> — the message handler runs at reduced priority deliberately. Network I/O (socket handler) must be responsive; protocol processing can lag slightly. This deliberate priority split ensures data is received before it is processed."

  - line: 858
    type: margin
    text: "<code>BitcoinMiner</code> thread: proof-of-work mining runs in its own thread (index 3). The comment \"todo: start one thread per processor\" shows Satoshi was aware of multi-core mining from the start. This single-threaded miner was quickly replaced by multi-threaded and then GPU miners."

  - line: 881
    type: margin
    text: "<code>StartNode</code> — the network bootstrap sequence. Initializes Winsock, resolves local hostname, creates and binds the TCP listen socket, sets it to non-blocking, discovers external IP, then spawns four threads: IRC seed, socket handler, connection opener, and message handler."

  - line: 887
    type: margin
    text: "<code>WSAStartup</code> — Windows Sockets API initialization. MAKEWORD(2,2) requests Winsock version 2.2. This must be called before any socket operations on Windows. The equivalent on Linux/macOS would be nothing — POSIX sockets need no initialization."

  - line: 926
    type: margin
    text: "Non-blocking sockets: FIONBIO with value 1 sets the listen socket to non-blocking mode via ioctlsocket(), and accepted inbound sockets inherit it — their recv/send calls return immediately with WSAEWOULDBLOCK rather than blocking. Outbound sockets created in ConnectSocket() are never switched over and stay blocking; the select() loop, which only touches sockets reported ready, is what keeps them from stalling."

  - line: 961
    type: margin
    text: "<code>addrIncoming</code> — if a previous session discovered our external IP, it was saved to wallet.dat. We restore it here as a fallback in case whatismyip.com is unreachable; GetMyExternalIP still runs and updates it if successful."

  - line: 968
    type: margin
    text: "<code>ThreadIRCSeed</code> — connects to IRC to bootstrap peer discovery. Early nodes joined <code>#bitcoin</code> (v0.01 uses <code>chat.freenode.net</code>) and encoded their IP in the nickname. Satoshi's elegant hack: reuse a global chat directory before the network could self-sustain. Hal Finney's attached <code>debug.log</code> from January 10, 2009 is a snapshot of that path working — and of how tiny the network still was.{{cite:finney-crash-debuglog-2009}}{{cite:waltz-1stbitcoinminer}}"

  - line: 974
    type: margin
    text: "Thread startup sequence: four threads created with _beginthread() (Windows CRT). All but ThreadIRCSeed run inside wrappers (like ThreadSocketHandler) that appear to catch exceptions and restart the inner function after a 5-second sleep. In practice the restart never happens: CATCH_PRINT_EXCEPTION calls PrintException(), which logs the error, shows a message box, and then re-throws (<code>throw;</code> in util.cpp), so the exception escapes the loop before the Sleep(5000). The three threads started here use indices 0–2 of vfThreadRunning; the miner, started from ui.cpp, uses index 3."

  - line: 998
    type: margin
    text: "<code>StopNode</code> — orderly shutdown. Sets fShutdown=true (all threads check CheckForShutdown() periodically), increments nTransactionsUpdated to wake waiting threads, then polls until all threads have exited. WSACleanup releases Winsock resources."

  - line: 1012
    type: margin
    text: "<code>CheckForShutdown</code> — the cooperative shutdown mechanism. Every thread's inner loop calls this periodically. If fShutdown is set, the thread marks itself as not running and calls _endthread() to exit. No forced killing — threads exit at their next safe yield point."

conclusion: |
  <p>
    The networking layer embodies Satoshi's trustless philosophy. Nodes do not trust
    their peers—they validate everything independently. A malicious peer can waste
    your bandwidth but cannot steal your coins or corrupt your view of the blockchain.
    The protocol assumes the worst about every connection and is correct to do so.
  </p>
  <p>
    Message propagation uses "inv" (inventory) announcements: nodes advertise what
    they have, peers request what they need. This pull-based model prevents spam,
    lets nodes prioritize important data (blocks over transactions), and ensures
    that no node can force another to download unwanted data.
  </p>
  <p>
    The design's elegance is in what it omits: no authentication, no identity, no
    trust hierarchy, no permissions. Every node is equal. The consensus rules
    encoded in <code>main.cpp</code> ensure that even a network of anonymous
    strangers—some of whom are actively trying to cheat—converges on the same
    truth. This is the property that makes Bitcoin censorship-resistant: there is
    no privileged node to coerce.
  </p>
