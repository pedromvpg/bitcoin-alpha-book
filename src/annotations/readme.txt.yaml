# Annotation for readme.txt - The Original README
file: "readme.txt"

title: "Satoshi's Instructions"

introduction: |
  <p>
    This is the original README file distributed with Bitcoin v0.01 ALPHA — a primary
    historical document from the birth of cryptocurrency. Written by Satoshi Nakamoto
    himself, it is part build instructions, part architectural overview, and part window
    into the mind of Bitcoin's creator. Every sentence reveals something about the design
    decisions, constraints, and priorities of the project in January 2009.
  </p>
  <p>
    The document is striking for what it emphasizes and what it omits. There is no
    explanation of what Bitcoin <em>is</em> — no mention of digital cash, peer-to-peer
    payments, or decentralized consensus. Satoshi had already published the whitepaper
    on the cryptography mailing list in October 2008; by the time this README was written,
    the audience was assumed to already understand the concept. Instead, the focus is
    entirely practical: how to obtain the dependencies, how to configure OpenSSL, and
    how to compile the code. This is a builder's document, not a manifesto.
  </p>
  <p>
    Perhaps the most remarkable line is on line 36: "Bitcoin does not use any encryption."
    This single sentence distinguishes Bitcoin from every cypherpunk project that came before
    it. Systems like PGP, Tor, and the earlier digital cash schemes (DigiCash, e-gold) relied
    on encryption to protect privacy. Bitcoin uses cryptography — specifically digital
    signatures and hash functions — but never encrypts data. All transactions are broadcast
    in the clear. All blocks are publicly readable. Privacy comes not from secrecy but from
    pseudonymity: your identity is hidden behind a cryptographic public key, but your
    transactions are visible to everyone. This design choice avoided the legal minefield of
    encryption export controls that had hindered earlier cypherpunk projects.
  </p>
  <p>
    The build instructions also reveal that Bitcoin v0.01 was a <em>Windows desktop
    application</em> with a graphical interface. The supported compilers — MinGW GCC 3.4.5
    and Microsoft Visual C++ 6.0 SP6 — were both Windows toolchains. The dependency paths
    all use Windows-style backslash notation. There is no mention of Linux, macOS, or any
    Unix-like system. Satoshi built Bitcoin to run on the most common desktop operating
    system of 2009.
  </p>

annotations:
  - line: 1
    type: margin
    text: "'BitCoin v0.01 ALPHA' — note the camel-case spelling with a capital C. Satoshi originally wrote the name as two words ('Bit Coin') or camel-case ('BitCoin') before settling on the now-standard 'Bitcoin' with a lowercase 'c'. The 'v0.01' version number and 'ALPHA' designation signal that Satoshi considered this a very early release — not even a beta. He was being cautious about the software's maturity while still making it available for others to examine and test."

  - line: 3
    type: margin
    text: "Copyright and license boilerplate. The MIT/X11 license reference and the OpenSSL attribution are legally required. The OpenSSL Toolkit uses a dual BSD/SSLeay license that requires acknowledgment in derived works. Eric Young (eay@cryptsoft.com) wrote the original SSLeay library that OpenSSL was forked from — his name appears here because OpenSSL's license mandates it."

  - line: 11
    type: margin
    text: "<strong>Compilers Supported</strong> — only two, both Windows-only. MinGW (Minimalist GNU for Windows) provides GCC 3.4.5 on Windows; MSVC 6.0 SP6 was Microsoft's C++ compiler from 1998, still widely used in 2009 for its stability. The specific version numbers suggest Satoshi tested with exactly these compilers. GCC 3.4.5 was already old in 2009 (GCC 4.x had been out for years), suggesting Satoshi prioritized compatibility over modern language features."

  - line: 17
    type: margin
    text: "<strong>Dependencies</strong> — four external libraries form Bitcoin's foundation. The default paths (backslash-prefixed root directories like <code>\\wxWidgets</code>) are Windows conventions, suggesting Satoshi installed each library at the root of a drive. This section is essentially the <code>package.json</code> or <code>Cargo.toml</code> of its era — manual dependency management before package managers existed for C++."

  - line: 22
    type: margin
    text: "<strong>wxWidgets</strong> — a cross-platform C++ GUI framework. Satoshi chose it over alternatives like Qt (which had licensing concerns at the time — Qt was GPL, not LGPL, until 2009) and FLTK (too minimal). wxWidgets' LGPL license with liberal exceptions meant Bitcoin could use it without being forced into GPL copyleft. Bitcoin Core eventually switched to Qt in 2011 after Qt adopted the LGPL."

  - line: 23
    type: margin
    text: "<strong>OpenSSL</strong> — provides ECDSA (transaction signing), SHA-256 (proof-of-work hashing), and RIPEMD-160 (address generation). In 2009, OpenSSL was the de facto standard cryptographic library for C/C++. Its 'Old BSD license with the problematic advertising requirement' refers to the original BSD clause requiring all advertising mentioning the software to credit the University of California — a clause widely considered a nuisance."

  - line: 24
    type: margin
    text: "<strong>Berkeley DB</strong> — the embedded database storing blocks, transactions, and wallet data. Its license required that 'linked software must be free open source' — a significant constraint. This effectively prevented anyone from building a proprietary Bitcoin node. Later versions of Bitcoin Core replaced Berkeley DB with LevelDB (for the block index) to avoid this licensing restriction, though <code>wallet.dat</code> continued using BDB for years."

  - line: 25
    type: margin
    text: "<strong>Boost</strong> — the Swiss Army knife of C++ libraries. Satoshi used it for <code>BOOST_FOREACH</code> (range iteration), <code>lexical_cast</code> (string conversion), <code>tuple</code> (multiple return values), and <code>array</code> (fixed-size containers). The 'MIT-like license' made it the least legally complicated dependency. Many Boost features were later absorbed into C++11, and Bitcoin Core gradually removed Boost dependencies over the following decade."

  - line: 34
    type: margin
    text: "<strong>OpenSSL build instructions</strong> — this section is remarkably detailed and reveals a key insight. Satoshi provides step-by-step instructions for building a <em>minimal</em> OpenSSL that excludes all encryption algorithms (RC2, RC4, RC5, IDEA, DES, Blowfish, CAST, AES, Camellia, SEED, RSA, DH). He strips OpenSSL down to only what Bitcoin actually needs: ECDSA, SHA-256, and RIPEMD-160."

  - line: 36
    type: margin
    text: "'Bitcoin does not use any encryption.' A profound statement. Every prior digital cash system — from David Chaum's DigiCash (1990) to Wei Dai's b-money proposal (1998) — relied on encryption for privacy. Satoshi took a fundamentally different approach: all data is public, all transactions are broadcast in cleartext, and privacy comes from pseudonymous keys rather than encrypted channels. This sidestepped the U.S. encryption export regulations (ITAR/EAR) that had hamstrung earlier cypherpunk tools like PGP."

  - line: 40
    type: margin
    text: "Patching OpenSSL to remove RSA dependencies. The <code>#ifndef OPENSSL_NO_RSA</code> guard around <code>#include &lt;openssl/rsa.h&gt;</code> and the stub function <code>ERR_load_RSA_strings(void) { }</code> are surgical modifications to allow OpenSSL to compile without its RSA implementation. This is Satoshi being thorough — not just avoiding encryption in Bitcoin's code, but ensuring the compiled binary literally cannot perform RSA operations."

  - line: 48
    type: margin
    text: "The <code>no-everything</code> configure line. Satoshi explicitly disables every symmetric cipher and public-key algorithm except the ones Bitcoin needs. The comment about 'batch files can't handle more than 9 parameters' is a pragmatic workaround for a Windows CMD limitation — the configure options are too numerous to pass as command-line arguments, so they must be embedded in the batch file itself."

  - line: 53
    type: margin
    text: "A classic build system hack: the OpenSSL build fails partway through after successfully producing <code>libeay32.dll</code> (the only output Bitcoin needs). Rather than fix the build, Satoshi simply comments out the error check (<code>REM if errorlevel 1 goto end</code>) so the script continues past the failure. Pragmatic, not elegant — but it works."

  - line: 65
    type: margin
    text: "<strong>Berkeley DB build instructions</strong> for MinGW with MSYS. The <code>--enable-mingw</code> flag cross-compiles for Windows, and <code>--enable-cxx</code> generates the C++ bindings that Bitcoin's <code>db.cpp</code> uses. These are terse instructions — just three lines — suggesting Berkeley DB was relatively straightforward to build compared to OpenSSL."

  - line: 73
    type: margin
    text: "<strong>Boost compatibility note</strong> — Satoshi warns that Boost 1.37 doesn't compile with MSVC 6.0 and recommends version 1.35 instead. MSVC 6.0 predated the C++98 standard's full adoption, and newer Boost versions relied on template features that MSVC 6.0's compiler couldn't handle. This is a reminder of the era's toolchain constraints — Satoshi was working with decade-old compiler technology."

conclusion: |
  <p>
    This README is a time capsule from January 2009. It documents a project built by one
    person using Windows-era C++ toolchains, manually managing four external dependencies,
    and patching OpenSSL by hand to strip out encryption. There is no <code>./configure &amp;&amp;
    make &amp;&amp; make install</code> — each dependency must be separately downloaded, built,
    and installed into the correct path. The barrier to building Bitcoin from source in 2009
    was substantial, which helps explain why so few people ran it in the early months.
  </p>
  <p>
    The document also serves as an architectural map. The four dependencies — wxWidgets,
    OpenSSL, Berkeley DB, and Boost — define the four pillars of Bitcoin v0.01: a graphical
    user interface, cryptographic primitives, persistent storage, and C++ utility support.
    Every one of these dependencies would eventually be replaced (Qt, libsecp256k1, LevelDB,
    C++11/17 standard library), but the four-pillar architecture — presentation, cryptography,
    storage, utilities — endures in Bitcoin Core today.
  </p>
  <p>
    Most importantly, the README establishes that Bitcoin was designed to be built and
    verified by anyone. Despite the manual dependency management, Satoshi provided enough
    detail for a competent C++ developer to reproduce the build. This transparency —
    the ability to compile the code yourself and verify that the binary matches — is
    foundational to the trustless ethos of the entire system. You don't have to trust
    Satoshi. You can read the code and build it yourself.
  </p>
