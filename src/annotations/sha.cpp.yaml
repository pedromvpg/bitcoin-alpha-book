# Annotation for sha.cpp - Cryptographic Hash Functions
file: "sha.cpp"

title: "The Hash That Secures Trillions"

introduction: |
  <p>
    Cryptographic hashing is the foundation of Bitcoin's security. This file
    implements the SHA-256 hash function that is used throughout Bitcoin
    for everything from transaction IDs to proof-of-work mining.
  </p>
  <p>
    A hash function takes any input and produces a fixed-size output (256 bits
    for SHA-256). The key properties are:
  </p>
  <ul>
    <li><strong>Deterministic:</strong> Same input always gives same output</li>
    <li><strong>One-way:</strong> Cannot reverse the hash to find the input</li>
    <li><strong>Collision-resistant:</strong> Nearly impossible to find two inputs with the same hash</li>
  </ul>

