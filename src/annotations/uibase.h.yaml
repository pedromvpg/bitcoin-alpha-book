# Annotation for uibase.h - GUI Blueprint
file: "uibase.h"

title: "GUI Blueprint"

introduction: |
  <p>
    This header file is the architectural drawing of Bitcoin's user interface — the
    class declarations, widget pointers, and virtual event handlers that define every
    window the user could see. While <code>uibase.cpp</code> constructs the widgets,
    this file declares what exists and how it can be extended. Like its companion, it
    was auto-generated by wxFormBuilder and carries the same <code>PLEASE DO "NOT"
    EDIT THIS FILE!</code> warning.
  </p>
  <p>
    The file declares fifteen GUI classes, and their names read like a feature list
    for a product far more ambitious than a simple payment tool:
    <code class="type">CMainFrameBase</code>,
    <code class="type">CTxDetailsDialogBase</code>,
    <code class="type">COptionsDialogBase</code>,
    <code class="type">CAboutDialogBase</code>,
    <code class="type">CSendDialogBase</code>,
    <code class="type">CSendingDialogBase</code>,
    <code class="type">CYourAddressDialogBase</code>,
    <code class="type">CAddressBookDialogBase</code>,
    <code class="type">CProductsDialogBase</code>,
    <code class="type">CEditProductDialogBase</code>,
    <code class="type">CViewProductDialogBase</code>,
    <code class="type">CViewOrderDialogBase</code>,
    <code class="type">CEditReviewDialogBase</code>,
    <code class="type">CPokerLobbyDialogBase</code>, and
    <code class="type">CPokerDialogBase</code>. The last five were never exposed to
    users in any public release.
  </p>
  <p>
    The wxWidgets includes at the top of this file — 28 headers from
    <code>&lt;wx/string.h&gt;</code> through <code>&lt;wx/checkbox.h&gt;</code> — reveal
    the full palette of GUI components Satoshi used. Rich text controls, HTML windows,
    tree views, scrolled windows, notebooks, and combo boxes are all present. This is
    not a minimal toolkit selection; it is the full wxWidgets arsenal deployed for an
    application that Satoshi clearly intended to grow into a comprehensive platform.
  </p>
  <p>
    Architecturally, each class follows the same pattern: <code>protected</code> member
    variables for widgets, <code>protected virtual</code> event handlers that default to
    <code>event.Skip()</code> (pass-through), and <code>public</code> constructors with
    default window titles and sizes. The derived classes in <code>ui.h</code> and
    <code>ui.cpp</code> override only the event handlers they need. This is the
    <strong>Template Method pattern</strong> — the base class defines the skeleton of
    the UI, subclasses fill in the behavior.
  </p>

annotations:
  - line: 15
    type: margin
    text: "Twenty-eight wxWidgets includes — a comprehensive selection covering strings, bitmaps, menus, toolbars, status bars, text controls, buttons, sizers (layout managers), panels, notebooks, frames, HTML windows, dialogs, combo boxes, scrolled windows, rich text, tree controls, and checkboxes. Each include pulls in a specific widget family. The breadth suggests Satoshi explored wxWidgets thoroughly before designing the interface."

  - line: 46
    type: margin
    text: "Widget ID constants, starting at 1000. <code class=\"variable\">wxID_MAINFRAME</code> through <code class=\"variable\">wxID_TEXTCTRL</code> — 52 unique identifiers. Notable entries: <code class=\"variable\">wxID_OPTIONSGENERATEBITCOINS</code> (1001) for the mining toggle, <code class=\"variable\">wxID_TRANSACTIONFEE</code> (1007) for the fee setting, IDs for 20 delete buttons (<code class=\"variable\">wxID_DEL0</code> through <code class=\"variable\">wxID_DEL19</code>) for the product editor form fields, and <code class=\"variable\">wxID_OPENNEWTABLE</code> through <code class=\"variable\">wxID_DITCHPLAYER</code> for the poker game."

  - line: 90
    type: margin
    text: "Poker game IDs: <code class=\"variable\">wxID_OPENNEWTABLE</code> (1044), <code class=\"variable\">wxID_DEALHAND</code> (1045), <code class=\"variable\">wxID_FOLD</code> (1046), <code class=\"variable\">wxID_CALL</code> (1047), <code class=\"variable\">wxID_RAISE</code> (1048), <code class=\"variable\">wxID_LEAVETABLE</code> (1049), <code class=\"variable\">wxID_DITCHPLAYER</code> (1050). A complete poker vocabulary. Satoshi apparently planned a peer-to-peer poker game built directly into the Bitcoin client — a natural application for a trustless digital cash system. Online poker was a massive industry in 2008 (until Black Friday in 2011), and Bitcoin would have solved the payment processing problem that plagued poker sites."

  - line: 102
    type: margin
    text: "<code class=\"type\">CMainFrameBase</code> — the primary window class, inheriting from <code class=\"type\">wxFrame</code>. Default title: <code>'Bitcoin'</code>, default size: 705x484 pixels. The <code>protected</code> section declares pointers to every widget in the main window: menu bar, three menus, toolbar, status bar, address text field, balance display, transaction filter, notebook, and five list controls (one visible, four hidden for the marketplace)."

  - line: 130
    type: margin
    text: "Virtual event handlers — twenty-one methods that all default to <code class=\"function\">event.Skip()</code>, meaning 'pass this event to the next handler in the chain.' The derived <code class=\"type\">CMainFrame</code> class in <code>ui.h</code> overrides these with actual logic: <code class=\"function\">OnClose</code> saves wallet state, <code class=\"function\">OnMenuOptionsGenerate</code> starts/stops mining, <code class=\"function\">OnButtonSend</code> opens the payment dialog. The <code>virtual</code> keyword is what makes the Template Method pattern work — the base class wires events to these methods, the derived class provides the implementation."

  - line: 154
    type: margin
    text: "The <code>public</code> section exposes <code class=\"variable\">m_menuOptions</code> and the five list controls. Making <code class=\"variable\">m_menuOptions</code> public allows the derived class to dynamically add or modify menu items — specifically, the mining checkbox needs to be checked/unchecked from outside the base class. The list controls are public so the derived class can populate them with transaction data, which requires direct access to insert and update rows."

  - line: 169
    type: margin
    text: "<code class=\"type\">CTxDetailsDialogBase</code> — transaction detail viewer using <code class=\"type\">wxHtmlWindow</code>. Size: 620x450, title: <code>'Transaction Details'</code>. The HTML window allowed Satoshi to render transaction details with formatted tables, bold labels, and color-coded status — far richer than plain text. The single <code class=\"function\">OnButtonOK</code> handler closes the dialog."

  - line: 190
    type: margin
    text: "<code class=\"type\">COptionsDialogBase</code> — the settings dialog. Size: 500x261, remarkably small because v0.01 had exactly one user-configurable option: the transaction fee. The <code class=\"function\">OnKillFocusTransactionFee</code> handler fires when the user clicks away from the fee field — used by the derived class to validate and format the entered amount."

  - line: 245
    type: margin
    text: "<code class=\"type\">CSendDialogBase</code> — the payment dialog. Size: 675x338. The widget declarations tell the story of v0.01's dual payment modes: <code class=\"variable\">m_textCtrlAddress</code> accepts either an IP address or Bitcoin address, <code class=\"variable\">m_textCtrlAmount</code> has a 20-character max length, <code class=\"variable\">m_choiceTransferType</code> offers transfer type selection (only 'Standard' in v0.01), and <code class=\"variable\">m_textCtrlMessage</code> allows attaching a message (only works with IP-based payments). The <code class=\"variable\">m_bitmapCheckMark</code> provides visual feedback when the address is valid."

  - line: 290
    type: margin
    text: "<code class=\"type\">CSendingDialogBase</code> — the payment progress dialog. Size: 442x151, title: <code>'Sending...'</code>. The <code class=\"function\">OnClose</code> and <code class=\"function\">OnPaint</code> handlers indicate this dialog has custom close behavior (you cannot simply close it while a payment is in progress) and custom painting (likely a progress animation). The OK button starts disabled — it only becomes clickable when the transaction completes or fails."

  - line: 317
    type: margin
    text: "<code class=\"type\">CYourAddressDialogBase</code> — manages receiving addresses. Buttons include <code>'Rename'</code>, <code>'New Address'</code>, <code>'Copy to Clipboard'</code>. The <code class=\"function\">OnListEndLabelEdit</code> handler indicates the list supports inline editing — users could click an address label and rename it directly in the list. This level of usability polish suggests Satoshi spent considerable time on the user experience."

  - line: 389
    type: margin
    text: "<code class=\"type\">CProductsDialogBase</code> — the marketplace browser. Title: <code>'Marketplace'</code>, size: 708x535. A <code class=\"type\">wxComboBox</code> for category filtering, a <code class=\"type\">wxTextCtrl</code> for search, and a list control for results. This is a complete product search interface — Satoshi envisioned users browsing and purchasing goods directly through the Bitcoin client, like a decentralized Amazon built into the wallet."

  - line: 415
    type: margin
    text: "<code class=\"type\">CEditProductDialogBase</code> — product listing editor. Note this inherits from <code class=\"type\">wxFrame</code>, not <code class=\"type\">wxDialog</code> — making it a full independent window rather than a modal popup. It has a scrolled window containing fields for category, title, price, multi-line description, multi-line order form instructions, and a <code class=\"variable\">wxFlexGridSizer</code> with 20 customizable form field rows (label + choices + delete button each). The <code class=\"function\">OnButtonSend</code> handler (not 'Save') reveals that product listings were broadcast to the network like transactions."

  - line: 620
    type: margin
    text: "<code class=\"type\">CPokerLobbyDialogBase</code> — a poker game lobby with a <code class=\"type\">wxTreeCtrl</code> for game categories and a <code class=\"type\">wxListCtrl</code> for available tables. Title: <code>'Poker Lobby'</code>, size: 586x457. The tree control suggests a hierarchy of game types (Texas Hold'em, Omaha, etc.) or stake levels. The <code>'New Table'</code> button would create a new poker game. This is fully laid-out infrastructure for peer-to-peer gambling with real bitcoin — a use case that would later become one of Bitcoin's earliest actual applications."

  - line: 645
    type: margin
    text: "<code class=\"type\">CPokerDialogBase</code> — the poker game table. Size: 806x550 with <code class=\"variable\">wxFULL_REPAINT_ON_RESIZE</code> (for custom card rendering) and <code class=\"variable\">wxFRAME_NO_TASKBAR</code>. Buttons: Deal Hand, Fold, Call, Raise, Leave Table, plus a <code>'Ditch Player'</code> text field (for kicking inactive players?). Six checkboxes handle pre-action selections: Sit Out, Pre-Fold, Pre-Call, Pre-Call Any, Pre-Raise, Pre-Raise Any. The <code class=\"function\">OnPaint</code> handler would have rendered the card table. This is a fully designed poker client — not a stub."

  - line: 692
    type: margin
    text: "<code class=\"type\">CGetTextFromUserDialogBase</code> — a generic input dialog with two text fields and two labels. Size: 403x138. Used throughout the application for prompts like 'Enter a label for this address' or 'Enter the amount.' A reusable utility dialog — evidence of Satoshi's pragmatic approach to GUI design, creating one flexible dialog rather than many specialized ones."

conclusion: |
  <p>
    This header file is a table of contents for Satoshi's complete vision. The fifteen
    class declarations describe not just a wallet but an ecosystem: payments, address
    management, a marketplace with product listings and order forms, a review system,
    and a poker game. Five of these fifteen classes — the marketplace browser, product
    editor, product viewer, order viewer, review editor — were never activated in any
    public release. The poker lobby and table bring it to seven unreleased interfaces
    out of fifteen total.
  </p>
  <p>
    The virtual event handler pattern deserves appreciation. By making every handler
    <code>virtual</code> with a default pass-through, Satoshi created a clean separation
    between layout and logic. The wxFormBuilder tool could regenerate this file at any
    time without affecting the behavioral code in the derived classes. This is not
    sophisticated software engineering by modern standards, but it shows that Satoshi
    understood object-oriented design patterns and applied them consistently. The same
    disciplined architecture that structures the consensus code also structures the
    button handlers.
  </p>
  <p>
    Perhaps most revealing are the poker IDs. The constants <code class="variable">wxID_FOLD</code>,
    <code class="variable">wxID_CALL</code>, and <code class="variable">wxID_RAISE</code>
    are not aspirational — they correspond to fully laid-out interfaces with checkboxes
    for pre-actions, custom paint handlers for card rendering, and a lobby system for
    finding tables. Satoshi was building an application where you could mine bitcoin,
    spend it in a marketplace, and gamble with it at a poker table — all within one
    window. That none of these features shipped publicly does not diminish their
    significance as evidence of how Satoshi conceived of Bitcoin's role in the world.
  </p>
