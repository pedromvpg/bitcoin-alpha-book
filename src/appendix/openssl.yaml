glossary:
  - term: "BER"
    definition: "Basic Encoding Rules: the permissive ASN.1 encoding that allows several byte strings for the same value, such as length fields longer than needed. OpenSSL's parser accepted BER signatures."
  - term: "Koblitz curve"
    definition: "In SEC 2, a curve whose parameters were chosen for an efficiently computable endomorphism rather than generated from a random seed; secp256k1 is one."
  - term: "readscreen"
    definition: "The OpenSSL 0.9.8 routine meant to hash the screen's contents into the random pool; in 0.9.8h a reversed test made it return early for ordinary desktop programs."
  - term: "signature malleability"
    definition: "The ability of a third party to change a signature's bytes, for example by replacing s with n − s or re-encoding it, without invalidating it, which changes the transaction's hash."
