# Reading Paths — guided tours through the v0.1.0 source.
#
# Rendered as the "Reading Paths" chapter at the end of Part I (scripts/build.js).
# Each step points at a definition (`symbol:` — the qualified name exactly as
# defined, e.g. "CBlock::AcceptBlock" or "SendMoney"), at a specific line
# (`file:` + `line:`), or at a line of OpenSSL 0.9.8h (`openssl:` + `line:`,
# path relative to src/openssl-0.9.8h/; the line must fall inside an excerpt
# printed in the OpenSSL appendix). File and OpenSSL steps may add `label:`,
# the function the line belongs to; it must appear on that line or on the
# nearest column-0 signature above it. The build prints the page number of
# that line; the validator (npm run validate) fails if a step cannot be resolved.
#
# Notes are plain-HTML prose in the book's voice; facts must match the source.

paths:
  - id: transaction
    title: "The Life of a Transaction"
    intro: |
      Follow one payment from the moment its sender clicks <em>Send</em> to the
      moment another node accepts it and passes it on.
    steps:
      - symbol: "CSendDialog::OnButtonSend"
        note: "The Send button. Parses the amount and the Bitcoin address, then builds a standard pay-to-public-key-hash <code>scriptPubKey</code> for the recipient and calls <code>SendMoney</code>."
      - symbol: "SendMoney"
        note: "The orchestrator: create and sign the transaction, mark the coins it spends, accept it locally, and broadcast it."
      - symbol: "CreateTransaction"
        note: "Selects coins from the wallet, adds a change output, signs every input, and loops until the fee is sufficient."
      - symbol: "SignSignature"
        note: "Hashes the transaction, solves the previous output's <code>scriptPubKey</code> to produce the <code>scriptSig</code>, then test-runs both with <code>EvalScript</code>."
      - symbol: "CommitTransactionSpent"
        note: "Adds the new transaction to the wallet and marks every coin it consumed as spent on disk."
      - symbol: "CWalletTx::RelayWalletTransaction"
        note: "Relays the transaction, preceded by any unconfirmed transactions it depends on, to every connected peer."
      - file: "main.cpp"
        line: 1868
        note: "On the receiving node: the <code>tx</code> message handler accepts the transaction, adds it to the wallet if it pays us, relays it onward, and retries any orphans that were waiting for it."
      - symbol: "CTransaction::AcceptTransaction"
        note: "Mempool admission: reject loose coinbases and duplicates, check for conflicts, connect the inputs, then add to the memory pool."
      - symbol: "CTransaction::ConnectInputs"
        note: "Looks up each previous output, enforces coinbase maturity, verifies the signature, and refuses outputs that are already spent."
      - symbol: "VerifySignature"
        note: "Joins the input's <code>scriptSig</code> and the previous output's <code>scriptPubKey</code> into one script and runs it."
      - symbol: "EvalScript"
        note: "The script interpreter itself: a stack machine whose <code>OP_CHECKSIG</code> finally checks the ECDSA signature."

  - id: mining
    title: "Mining a Block"
    intro: |
      Follow a block from an empty template on the miner's machine to the tip
      of every node's best chain.
    steps:
      - symbol: "BitcoinMiner"
        note: "The mining loop. Builds a coinbase paying a fresh key, gathers transactions from the memory pool, and fills in the block header."
      - symbol: "GetNextWorkRequired"
        note: "Computes the difficulty target for the next block, retargeting every 2016 blocks."
      - symbol: "CBlock::GetBlockValue"
        note: "The block reward: the subsidy, halving every 210,000 blocks, plus the fees of the included transactions."
      - symbol: "BlockSHA256"
        note: "The hot loop's hash. The miner increments the nonce and double-hashes the prebuilt header until the result falls below the target."
      - symbol: "ProcessBlock"
        note: "A found block is handled exactly as if it had arrived from a peer. Checks it, accepts it, then adopts any orphans that were waiting for it."
      - symbol: "CBlock::CheckBlock"
        note: "Context-free checks: size, timestamp, a single coinbase first, valid transactions, proof of work, and merkle root."
      - symbol: "CBlock::AcceptBlock"
        note: "Contextual checks against the previous block, then writes the block to disk, indexes it, and relays it if it is now the best chain."
      - symbol: "CBlock::AddToBlockIndex"
        note: "Extends the best chain directly, or triggers a reorganization when a side branch has grown longer."
      - symbol: "CBlock::ConnectBlock"
        note: "Connects every transaction's inputs, marking their previous outputs spent in the transaction index."
      - symbol: "Reorganize"
        note: "Disconnects blocks back to the fork point and connects the longer branch, returning orphaned transactions to the memory pool."

  - id: network
    title: "A Node Joins the Network"
    intro: |
      Follow a freshly started node from loading its files to its first
      conversation with a peer.
    steps:
      - symbol: "CMyApp::OnInit2"
        note: "Startup. Loads the address book, the block index, and the wallet, then starts networking and, if enabled, the miner."
      - symbol: "LoadBlockIndex"
        note: "Reads the block index from disk; on first run, builds the genesis block with its <em>Times</em> headline and writes it out."
      - symbol: "StartNode"
        note: "Binds the listening socket on port 8333, discovers the external IP, and launches the IRC seeding, socket, connection, and message threads."
      - symbol: "ThreadIRCSeed"
        note: "Joins <code>#bitcoin</code> on <code>chat.freenode.net</code>; nicknames beginning with <code>u</code> encode peers' IP addresses, which are decoded and stored."
      - symbol: "AddAddress"
        note: "Records a newly learned peer address in memory and in the address database."
      - symbol: "ThreadOpenConnections2"
        note: "Picks addresses to dial and opens outbound connections up to the connection limit."
      - symbol: "ConnectNode"
        note: "Opens a TCP socket to a peer and wraps it in a new <code>CNode</code>, whose constructor immediately queues a <code>version</code> message."
      - symbol: "ThreadSocketHandler2"
        note: "The <code>select()</code> loop that accepts inbound connections and moves bytes between sockets and each node's buffers."
      - symbol: "ThreadMessageHandler2"
        note: "Polls every node in turn, processing received messages and sending queued ones."
      - file: "main.cpp"
        line: 1705
        note: "The <code>version</code> handler: negotiates the protocol version and, from a full node, requests blocks with <code>getblocks</code>. Synchronization begins."

  - id: keys
    title: "From Randomness to an Address"
    intro: |
      Follow a key pair from the entropy gathered before <code>main</code> runs to
      the address the wallet shows as <em>Your Address</em>. Several steps cross into
      OpenSSL; their pages are in the appendix.
    steps:
      - file: "util.cpp"
        line: 29
        label: "CInit::CInit"
        note: "A global object's constructor, so it runs before <code>main</code>. Gives OpenSSL one Windows mutex per lock it asks for, then seeds the random pool with <code>RAND_screen</code> and <code>RandAddSeed(true)</code>."
      - openssl: "crypto/rand/rand_win.c"
        line: 625
        label: "RAND_screen"
        note: "Inside OpenSSL. <code>RAND_poll</code> gathers Windows sources, the CryptoAPI generator among them; <code>readscreen</code> is meant to hash the screen but, through a reversed test, returns early for an ordinary desktop program."
      - symbol: "RandAddSeed"
        note: "Satoshi's own sources: the CPU performance counter on every call and, at startup or at most every five minutes after, a SHA-256 hash of the Windows performance data."
      - symbol: "CMainFrame::OnMouseEvents"
        note: "Mouse events in the main window add the performance counter and the pointer's x and y coordinates to the pool."
      - symbol: "LoadWallet"
        note: "On first run the wallet has no default key, so one is made, stored, and labeled \"Your Address\" in the address book."
      - file: "key.h"
        line: 49
        label: "CKey::CKey"
        note: "Every <code>CKey</code> begins as an empty OpenSSL key on secp256k1: <code>EC_KEY_new_by_curve_name(NID_secp256k1)</code>."
      - openssl: "crypto/ec/ec_curve.c"
        line: 381
        label: "_EC_SECG_PRIME_256K1"
        note: "The curve that ID names, as OpenSSL stores it: the field prime p, a = 0, b = 7, the generator G, and its order n, in hex from SEC 2."
      - file: "key.h"
        line: 75
        label: "CKey::MakeNewKey"
        note: "One call: <code>EC_KEY_generate_key</code>."
      - openssl: "crypto/ec/ec_key.c"
        line: 262
        label: "EC_KEY_generate_key"
        note: "The private key is a random integer from 1 to n − 1, drawn from the pool seeded above. The public key is that number times G."
      - symbol: "AddKey"
        note: "Stores the pair in <code>mapKeys</code>, the private key DER-encoded by <code>i2d_ECPrivateKey</code>, indexes the public key by its <code>Hash160</code>, and writes both to <code>wallet.dat</code>."
      - symbol: "Hash160"
        note: "SHA-256, then RIPEMD-160, both from OpenSSL: the 20-byte hash an address encodes."
      - symbol: "Hash160ToAddress"
        note: "Prepends the version byte 0 and Base58-encodes the result with a four-byte checksum. <code>PubKeyToAddress</code> is this function applied to <code>Hash160</code> of the public key."

  - id: signatures
    title: "A Signature, Made and Checked"
    intro: |
      Follow one input's signature from the sender's wallet, through OpenSSL's ECDSA
      code, to the check every node runs before accepting the transaction.
    steps:
      - symbol: "SignSignature"
        note: "Called by <code>CreateTransaction</code> for each input. Hashes the transaction, has <code>Solver</code> produce the <code>scriptSig</code>, then test-runs it with <code>EvalScript</code>."
      - symbol: "SignatureHash"
        note: "Copies the transaction, blanks every input's <code>scriptSig</code>, puts the previous output's script in the one being signed, appends the hash type, and double-SHA-256es the result. These 32 bytes are what gets signed."
      - file: "script.cpp"
        line: 975
        label: "Solver"
        note: "Matches the previous output against the two standard templates, finds the private key in <code>mapKeys</code>, signs, and appends the hash-type byte; for a pay-to-address output it pushes the public key too."
      - file: "key.h"
        line: 121
        label: "CKey::Sign"
        note: "Hands the hash and key to <code>ECDSA_sign</code> with a 10,000-byte buffer for a DER-encoded signature of at most 72 bytes."
      - openssl: "crypto/ecdsa/ecs_ossl.c"
        line: 139
        label: "ecdsa_sign_setup"
        note: "Draws the nonce k from the random pool, computes R = k × G, takes r from R's x-coordinate, and inverts k. A repeated or predictable k gives away the private key."
      - openssl: "crypto/ecdsa/ecs_ossl.c"
        line: 295
        label: "ecdsa_do_sign"
        note: "s = k<sup>−1</sup>(m + r·d) mod n. Nothing here keeps s in the lower half of its range, the root of the malleability the appendix describes."
      - symbol: "VerifySignature"
        note: "On the receiving node, <code>ConnectInputs</code> calls this for every input: the <code>scriptSig</code> and the previous output's <code>scriptPubKey</code>, run as one script."
      - file: "script.cpp"
        line: 692
        label: "OP_CHECKSIG"
        note: "Pops the signature and public key, removes the signature from the script being hashed, since a signature cannot sign itself, and calls <code>CheckSig</code>."
      - symbol: "CheckSig"
        note: "Parses the public key with <code>o2i_ECPublicKey</code>, strips the hash-type byte from the signature, recomputes <code>SignatureHash</code>, and asks the key to verify."
      - file: "key.h"
        line: 133
        label: "CKey::Verify"
        note: "Only a return value of 1 passes. <code>ECDSA_verify</code>'s −1 for an error and 0 for a bad signature both fail."
      - openssl: "crypto/ecdsa/ecs_vrf.c"
        line: 91
        label: "ECDSA_verify"
        note: "Parses the DER bytes with <code>d2i_ECDSA_SIG</code>. Whatever this permissive parser accepted was, until BIP 66, a valid Bitcoin signature."
      - openssl: "crypto/ecdsa/ecs_ossl.c"
        line: 441
        label: "ecdsa_do_verify"
        note: "Checks that r and s lie in [1, n − 1], computes u1 × G + u2 × Q, and accepts if that point's x-coordinate mod n equals r."
